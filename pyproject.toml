[project]
name = "chemart"
version = "0.1.0"
description = "A mart of artificial chemistries: catalog, generators and CRN interop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "brotli>=1.2.0",
    "numpy>=2.5.3",
    "pyyaml>=6",
    "rdkit>=2026.3.6",
    "scipy>=1.18.1",
    "viennarna>=2.7.2",
]

[project.scripts]
chemart = "chemart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemart"]

# The catalog is edited in catalog/chemistries/ but must ship with the package.
[tool.hatch.build.targets.wheel.force-include]
"catalog/chemistries" = "chemart/_catalog"

[tool.uv]
# `uv sync` / `uv run` include the test and docs tools, so `uv run mkdocs serve`
# works out of the box. The notebooks group stays opt-in: --group notebooks.
default-groups = ["dev", "docs"]

[tool.uv.workspace]
# hub/ is the Chemart Hub server; the library above never depends on it.
members = ["hub"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
notebooks = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
]

[tool.pytest.ini_options]
markers = ["slow: takes more than ~2 s; excluded by default, run with -m 'slow or not slow'"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
