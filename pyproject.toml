[project]
name = "chemart"
version = "0.1.0"
description = "A mart of artificial chemistries: catalog, generators and CRN interop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyyaml>=6",
    "scipy>=1.18.1",
]

[project.scripts]
chemart = "chemart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chemart"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["slow: takes more than ~2 s; excluded by default, run with -m 'slow or not slow'"]
addopts = "-m 'not slow'"
