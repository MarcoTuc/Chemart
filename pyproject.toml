[project]
name = "chemart"
version = "0.1.0"
description = "A mart of artificial chemistries: catalog, generators and CRN interop"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Marco Tuccio", email = "marco.tuccio95@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "artificial-chemistry", "artificial-life", "chemical-reaction-networks",
    "complex-systems", "origin-of-life", "systems-chemistry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    "brotli>=1.2.0",
    "networkx>=3.7",
    "numpy>=2.5.3",
    "pyyaml>=6",
    "rdkit>=2026.3.6",
    "scipy>=1.18.1",
    "viennarna>=2.7.2",
]

[project.urls]
Homepage = "https://marcotuc.github.io/Chemart/"
Documentation = "https://marcotuc.github.io/Chemart/"
Source = "https://github.com/MarcoTuc/Chemart"
Catalog = "https://marcotuc.github.io/Chemart/catalog/"

[project.optional-dependencies]
# pycddlib-standalone publishes no wheels, so it compiles from source on every
# platform. Only two exponential-cost measures import it, lazily: p_invariants
# and elementary_flux_modes. measure() defaults to cost="cheap" and never
# reaches them.
invariants = ["pycddlib-standalone>=3.0.0"]
all = ["chemart[invariants]"]

[project.scripts]
chemart = "chemart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The source distribution carries the library and the catalog it reads. It
# leaves out tests/, hub/ (a separate workspace package), docs/, tools/ and
# research/.
[tool.hatch.build.targets.sdist]
only-include = ["chemart", "catalog/chemistries", "README.md"]

[tool.hatch.build.targets.wheel]
packages = ["chemart"]

# The catalog is edited in catalog/chemistries/ but must ship with the package.
[tool.hatch.build.targets.wheel.force-include]
"catalog/chemistries" = "chemart/_catalog"

[tool.uv]
# `uv sync` / `uv run` include the test and docs tools, so `uv run mkdocs serve`
# works out of the box. The notebooks group stays opt-in: --group notebooks.
default-groups = ["dev", "docs"]

[tool.uv.workspace]
# hub/ is the Chemart Hub server; the library above never depends on it.
members = ["hub"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]
notebooks = [
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
]

[tool.pytest.ini_options]
markers = ["slow: takes more than ~2 s; excluded by default, run with -m 'slow or not slow'"]
addopts = "-m 'not slow'"
testpaths = ["tests"]
