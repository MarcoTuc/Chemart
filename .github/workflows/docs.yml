name: docs

on:
  push:
    # `main` once this lands there; `chemart-library` is the current branch.
    branches: [main, chemart-library]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the latest run matters; cancel superseded ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment
        # The docs group holds mkdocs; the project itself is needed because the
        # catalog pages are generated by importing chemart.
        run: uv sync --group docs

      - name: Regenerate the catalog index and per-chemistry pages
        run: |
          uv run python -m chemart.catalog index
          uv run python tools/gen_catalog_pages.py

      - name: Build the site
        run: uv run mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
