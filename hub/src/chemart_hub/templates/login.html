{% extends "base.html" %}
{% block title %}Log in · Chemart Hub{% endblock %}
{% block body %}
<div class="wrap">
  <form class="form-card" action="/login" method="post">
    <h1>Welcome back</h1>
    <p class="muted" style="margin-top:0">Log in to share chemistries and manage your tokens.</p>
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" autocomplete="username" required value="{{ username or '' }}" autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn-primary" type="submit">Log in</button>
    {% if signup %}<p class="form-foot">New here? <a href="/signup">Create an account</a></p>{% endif %}
  </form>
</div>
{% endblock %}
