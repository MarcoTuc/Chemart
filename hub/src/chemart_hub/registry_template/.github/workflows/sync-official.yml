name: sync-official

# Keeps repos/chemart/ in step with the chemart library: once a week (or on
# demand) it regenerates the official shelf and, if anything changed, opens a
# pull request for a maintainer to merge.
#
# Needs Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests". Pull requests opened with the workflow's own token
# do not trigger the validate workflow; a maintainer reviews and merges them.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  CHEMART_REPO: {{CHEMART_REPO}}
  CHEMART_REF: {{CHEMART_REF}}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Chemart
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHEMART_REPO }}
          ref: ${{ env.CHEMART_REF }}
          path: .chemart

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --project .chemart --package chemart-hub

      - name: Regenerate the official shelf
        run: uv run --project .chemart chemart-hub sync-official .

      - name: Open a pull request if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain repos/chemart)" ]; then
            echo "The official shelf is up to date."
            exit 0
          fi
          branch="sync-official-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add repos/chemart
          git commit -m "Sync the official shelf with Chemart"
          git push -u origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" \
            --title "Sync the official shelf with Chemart" \
            --body "Regenerated by \`chemart-hub sync-official\` from ${{ env.CHEMART_REPO }}@${{ env.CHEMART_REF }}."
