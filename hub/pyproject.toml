[project]
name = "chemart-hub"
version = "0.1.0"
description = "Chemart Hub: the public shelf where people share artificial chemistries and reaction networks"
requires-python = ">=3.12"
dependencies = [
    "chemart",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markdown>=3.10.3",
    "nh3>=0.3.7",
    "pygments>=2.21.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
]

[project.scripts]
chemart-hub = "chemart_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chemart_hub"]

[tool.uv.sources]
chemart = { workspace = true }
