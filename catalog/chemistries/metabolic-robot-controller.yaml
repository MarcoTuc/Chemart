chemistries:

- id: metabolic-robot-controller
  name: Metabolic / artificial biochemical network robot controllers
  origin: "Ziegler & Banzhaf, 2001; Lones, Fuente, Turner et al."
  book: "16.1.3"
  refs: ["[958]", "[959]", "[519]", "[520]", "[68]", "[660]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "abstract substances; sensor readings are injected as molecules, motor commands are read from product concentrations", definition: explicit}
  R:
    definition: explicit
    arity: variable
    scheme: >
      Bipartite directed weighted graph G = (V, E), V = R u S with R the
      reactions and S the substances; edges alternate types; special edges
      S -> R carry catalytic or inhibitory weights k_i in [k_min, k_max],
      ordinary edges carry a default k_0. Material balance is enforced.
  A: {reactor: ode, dilution: none}
  params:
    - {name: n_substances, type: int, role: structural}
    - {name: n_reactions, type: int, role: structural}
    - {name: k_min, type: float, role: kinetic}
    - {name: k_max, type: float, role: kinetic}
    - {name: k_0, type: float, role: kinetic, meaning: "default weight of stoichiometric edges"}
    - {name: sensor_map, type: callable, role: structural, meaning: "which sensors inject which species"}
    - {name: actuator_map, type: callable, role: structural, meaning: "which species drive which motors"}
    - {name: evolution, type: enum, default: gp, range: "hand-designed | genetic-programming", role: selection}
  provides: [topology, stoichiometry, catalysts, rate-constants, mass-conservation]
  generator_ready: partial
  phenomena: ["light seeking and obstacle avoidance on a Khepera robot", "evolved networks transfer between simulation and hardware up to a scale factor", "combined genetic + metabolic + signalling networks controlling chaotic dynamical systems"]
  notes: >
    The book gives an explicit graph grammar including the mass-balance
    constraint and a shortest-path 'metabolic pathway' extraction
    procedure. That pathway extraction is worth exposing as a Chemart
    analysis: subgraph P(v,w) containing only nodes on the shortest path
    from v to w, with every reaction on the path participating.
