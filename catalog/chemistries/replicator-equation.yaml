chemistries:

- id: replicator-equation
  name: Replicator equation (evolutionary game dynamics)
  intuition: >
    Evolutionary game theory as reactions. Strategies meet in pairs and the
    payoff matrix decides what happens: a positive entry means the first
    strategy replicates in the encounter, a negative one that it is removed,
    with the opponent surviving either way. Evolutionarily stable strategies
    are the rest points. Note the shape of the reaction - the opponent appears
    on both sides as a catalyst, so a net stoichiometric matrix would erase
    the very interaction the model is about.
  book: "7.2.8"
  refs: ["[621]", "[563]", "[564]", "[792]"]
  family: evolutionary-dynamics
  archived: pruned
  kind: generator
  constructive: false
  network: given
  S: {repr: "n strategies X_1..X_n", definition: explicit}
  R:
    definition: explicit
    arity: 2
    scheme: "X_i + X_j --a_ij--> 2X_i + X_j (a_ij > 0, cooperative/catalytic) ; X_i + X_j --(-a_ij)--> X_j (a_ij < 0, defective) ; elastic for a_ij = 0"
  A: {reactor: [ode, ssa], dilution: "phi = sum_ij a_ij x_i x_j"}
  params:
    - {name: A, type: list, default: [[0.0, -1.0, 1.0], [1.0, 0.0, -1.0], [-1.0, 1.0, 0.0]], role: selection, meaning: "n x n payoff matrix a_ij; asymmetry a_ij != a_ji encodes the game. Default: rock-paper-scissors"}
    - {name: x0, type: list, default: [], role: population, meaning: "initial frequencies; empty means uniform 1/n"}
  provides: [topology, stoichiometry, catalysts, rate-constants, flow, initial-state]
  fidelity: book+decisions
  decisions:
    - "n is the size of A rather than a separate parameter. The book gives no game; the default is rock-paper-scissors. The dilution flux phi is outflow = 'constant-total', which equals eq. 7.24."
    - "A diagonal term a_ii is the bimolecular self-interaction 2X_i -> 3X_i (a_ii > 0) or 2X_i -> X_i (a_ii < 0)."
  phenomena: ["evolutionarily stable strategies (ESS)", "known to be equivalent to Lotka-Volterra with n+1 strategies"]
  notes: "Note the catalytic form: X_j is on both sides. Net stoichiometry alone would erase it."
