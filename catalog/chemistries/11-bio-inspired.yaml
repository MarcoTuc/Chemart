# Chapter 11: bio-inspired ACs. String rewriting with biological framing,
# lock-and-key matching, explicit network/graph chemistries, and space+motion.
chemistries:

- id: mcs-bl
  name: Molecular Classifier System (MCS.bl)
  origin: "McMullin, Decraene, Kelly et al., 2007-2011; based on Holland's Broadcast Language (1975) and classifier systems"
  book: "11.1.1"
  refs: ["[221]", "[222]", "[224]", "[225]", "[452]", "[570]", "[395]", "[396]"]
  family: bio-inspired
  kind: generator
  constructive: true
  S:
    repr: >
      Broadcast devices: strings over {0, 1, *, :, #, $, %, '} containing one
      or more broadcast units (condition part ':' action part, opened by '*').
      '#' and '%' are single-character wildcards, '$' a multi-character
      wildcard; % and $ on both sides mean transposition of the match;
      "'" quotes the next symbol.
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "S1 + S2 -> S1 + S2 + S3 (both reactants catalytic)"
    notes: >
      Realisable operations (book table 11.1): no reaction, activation,
      inhibition, universal replication, self-replication, concatenation,
      cleavage.
  A:
    reactor: compartments
    dilution: "cells divide at a threshold; total cell count constant, so a division kills another cell"
    notes: "multilevel selection: molecular reproduction inside cells + competition between cells"
  params:
    - {name: p_s, type: float, default: 1e-5, role: stochastic, meaning: "per-symbol mutation probability during reaction; applied as flip / insert / delete with equal probability"}
    - {name: n_cells, type: int, default: 31, role: population}
    - {name: cell_capacity, type: int, default: 1000000, role: population, meaning: "max molecules per cell"}
    - {name: division_target, type: matrix, role: selection, meaning: "molecular species and count required to trigger division (e.g. 200 copies of s1); this is the higher-level selection knob"}
    - {name: seed_molecules, type: matrix, role: population}
  provides: [topology, catalysts, compartments, flow, sequence-structure-function]
  generator_ready: yes
  phenomena: ["succession of dominant cell types c0->c1->c2->c3, each a small self-maintaining string set (book table 11.2)", "selection pressure can be aimed at a chosen molecular species by changing the division criterion"]

- id: stringmol
  name: Stringmol
  origin: "Hickinbotham, Clark, Stepney et al. (University of York), 2010-2011"
  book: "11.1.2"
  refs: ["[379]", "[380]", "[381]", "[783]"]
  family: bio-inspired
  kind: generator
  constructive: true
  S:
    repr: >
      Strings over Sigma = 26 template codes (A..Z) + 7 function codes
      ($ > ^ ? = % }). Each molecule carries a sequence, a pointer vector
      (flow / instruction / write / read), an activity vector, and a status
      flag (unbound | active | passive).
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: >
      Two molecules bind with some probability if close in the topology.
      A Smith-Waterman alignment against a COMPLEMENTARITY table (offset 13
      in the template alphabet; function codes are self-complementary)
      picks the best-matching segments and hence the binding offset.
      One molecule becomes the enzyme; execution of its function codes
      produces products.
    notes: "opcodes: $ search, > move, ^ toggle, ? if, = copy, % cleave, } end"
  A:
    reactor: [well-stirred-multiset, lattice-2d]
    dilution: "fixed-capacity container; parasites compete for space"
  params:
    - {name: complement_offset, type: int, default: 13, role: structural, meaning: "distance defining template complementarity"}
    - {name: copy_error, type: float, default: 1e-5, role: stochastic, meaning: "per-symbol substitution rate on '=' (copy); insertions/deletions are rarer"}
    - {name: bind_probability, type: float, role: stochastic}
    - {name: capacity, type: int, role: population}
    - {name: seed_replicase, type: matrix, role: population, meaning: "hand-designed self-replicator; many alternatives exist"}
  provides: [topology, catalysts, flow, sequence-structure-function]
  generator_ready: yes
  reference_impl: "stringmol (upstream, open source)"
  phenomena: ["extinction events", "characteristic sweeps and slow sweeps", "neutral drift", "subpopulations of non-lethal parasites", "rapid sweep cascades", "emergence of hypercycles when a dominant species loses self-replication"]

- id: sac
  name: SAC (string-based artificial chemistry with cells)
  origin: "Suzuki & Ono, 2002-2004"
  book: "11.1.3"
  refs: ["[642]", "[823]", "[826]"]
  family: bio-inspired
  kind: generator
  constructive: true
  S:
    repr: >
      Strings over {., 0,1,2,3, ', \", !, ?, %, *, /, \\, &, $, M, E, L, R}
      decoded into rewriting rules. M/E build membrane strings; L/R are
      spindle signals for active transport.
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: >
      A decoded string acts as a set of guarded rewriting rules combined by
      & (AND) and $ (AND-NOT). Example: \\0!$001*012  =>  [\\0][\\!] $ [00*01 -> 01*02],
      which rewrites 002301 into 012302.
  A:
    reactor: compartments
    dilution: "cells grow by producing strings, divide at a size threshold or when a membrane string with enough M symbols exists; oldest cell removed when the cell cap is reached"
  params:
    - {name: cell_cap, type: int, role: population}
    - {name: division_size, type: int, role: population}
    - {name: organisation, type: enum, default: chromosome, range: "independent genes | chromosome | chromosome+spindle", role: structural, meaning: "the paper's three models; only coordinated replication (ii, iii) sustains cell reproduction"}
    - {name: age_limit, type: int, role: selection}
    - {name: seed_program, type: matrix, role: population, meaning: "the 12-string universal-constructor replication system"}
  provides: [topology, catalysts, compartments, sequence-structure-function]
  generator_ready: partial
  phenomena: ["independent gene replication stalls; chromosome and spindle variants sustain growth", "cell-level life cycle"]

- id: conrad-enzymatic
  name: Conrad's lock-and-key enzymatic / self-assembly processor
  origin: "Conrad, 1974-1992"
  book: "11.2.1; also 17.1.2 (emergence vs. programmability tradeoff)"
  refs: ["[193]", "[194]", "[196]", "[954]", "[722]"]
  family: bio-inspired
  kind: wet
  constructive: false
  S:
    repr: "signalling molecules with shapes; adaptor and effector molecules"
    definition: explicit
  R:
    definition: implicit
    arity: variable
    scheme: "shape-complementary self-assembly into a macromolecular mosaic that binds an adaptor and triggers a signalling cascade"
  A:
    reactor: well-stirred-multiset
    dilution: none
    notes: "computation = free energy minimisation; a downhill dynamical process"
  provides: [topology, energies]
  generator_ready: no
  notes: >
    Conceptual/wet. Its lasting contribution to Chemart is the
    emergence-vs-programmability tradeoff: "a system cannot at the same
    time be effectively programmable, amenable to evolution by variation
    and selection, and computationally efficient."

- id: farmer-immune
  name: Bitstring immune system model (idiotypic network)
  origin: "Farmer, Packard & Perelson, 1986"
  book: "11.2.2"
  refs: ["[261]", "[262]", "[214]", "[287]", "[288]"]
  family: bio-inspired
  kind: generator
  constructive: true
  S:
    repr: "antibodies as binary strings with two binding sites (paratope p, epitope e); antigens likewise"
    definition: implicit
  R:
    definition: explicit
    arity: 2
    scheme: >
      Recognition of e_i by p_j leads to replication of the recogniser and
      destruction of the recognised. Matching specificity:
      m_ij = sum_k G( sum_n [ e_i(n+k) XOR p_j(n) ] - s + 1 ),
      G(x)=x for x>0 else 0, over all alignments k in (-l_p, l_e).
  A:
    reactor: [ode, ssa]
    dilution: "metadynamics: periodically drop species below a concentration threshold and inject new ones"
    notes: >
      x_i' = c[ sum_j m_ji x_i x_j - k1 sum_j m_ij x_i x_j + sum_j m_ji x_i y_j ] - k2 x_i
      y_i' = -k3 sum_j m_ij x_j y_i
  params:
    - {name: l_e, type: int, role: structural, meaning: "epitope length"}
    - {name: l_p, type: int, role: structural, meaning: "paratope length"}
    - {name: s, type: int, role: structural, meaning: "matching threshold for binding"}
    - {name: c, type: float, role: kinetic, meaning: "weight of the interactive part vs. spontaneous decay"}
    - {name: k1, type: float, role: kinetic, meaning: "suppression vs. stimulation weight, antibody-antibody"}
    - {name: k2, type: float, role: kinetic, meaning: "spontaneous antibody decay rate"}
    - {name: k3, type: float, role: kinetic, meaning: "suppression weight, antibody-antigen"}
    - {name: N, type: int, role: population, meaning: "number of antibody species"}
    - {name: M, type: int, role: population, meaning: "number of foreign antigens"}
    - {name: mutation_ops, type: enum, default: "point + crossover + inversion", role: stochastic}
  provides: [topology, stoichiometry, rate-constants, rate-law, flow, sequence-structure-function]
  generator_ready: yes
  phenomena: ["clonal selection", "idiotypic network memory", "constructive dynamics via metadynamics"]
  notes: >
    One of very few entries where the chemistry itself PRESCRIBES rate
    coefficients (from the structural match m_ij) rather than leaving them
    free. This is the template for Chemart's `structure -> rate` hook.

- id: toychem
  name: ToyChem (graph-based toy model of chemistry)
  origin: "Benko, Flamm & Stadler, 2003-2006"
  book: "11.3.1; used in the RNA AC of 18.1.1"
  refs: ["[102]", "[103]", "[104]", "[105]", "[333]", "[300]"]
  family: network
  kind: generator
  constructive: true
  S:
    repr: "molecules as graphs of atoms with hybrid orbitals derived from VSEPR rules; abstracted into an orbital graph carrying sigma/pi/other bonds"
    definition: implicit
    notes: "parameterised for H, C, N, O, P, S"
  R:
    definition: implicit
    arity: 2
    scheme: "graph rewriting driven by outer-orbital overlap; conserves mass and atom types; energies come from an extended-Hueckel-style orbital treatment"
  A:
    reactor: [ode, ssa]
    dilution: none
    notes: "the implementation emits ODEs for the generated network automatically"
  params:
    - {name: atom_types, type: enum, default: "H C N O P S", role: structural}
    - {name: energy_params, type: matrix, role: thermodynamic, meaning: "orbital energy parameters per atom type"}
    - {name: expansion_depth, type: int, role: structural, meaning: "how far to expand the reaction network from the seed molecules"}
    - {name: barrier_cutoff, type: float, role: thermodynamic, meaning: "max activation energy for a reaction to be retained"}
  provides: [topology, stoichiometry, energies, thermodynamic-consistency, mass-conservation, rate-constants, sequence-structure-function]
  generator_ready: partial
  phenomena: ["reaction networks with the 'look and feel' of real chemistry", "generic connectivity and degree-distribution statistics"]
  notes: >
    THE reference case for Chemart's thermodynamic tier. It is the only
    chemistry in the book that computes activation energies from first
    principles and can therefore hand back Arrhenius rate constants and a
    genuine mass-conservation vector. Any output schema that cannot carry
    per-species energies and per-reaction barriers fails on this entry.

- id: bigan-conservative-crn
  name: Conservative random chemical reaction networks
  origin: "Bigan, Bourbon, Dessalles et al., 2013-2015"
  book: "11.3.2"
  refs: ["[117]", "[756]", "[956]"]
  family: network
  kind: generator
  constructive: false
  S:
    repr: "N abstract chemicals A_1..A_N, each with a random Gibbs free energy of formation"
    definition: explicit
  R:
    definition: implicit
    arity: [1, 2]
    scheme: "association A_i + A_j -> A_k ; dissociation A_i -> A_j + A_k ; transformation A_i -> A_j"
    notes: >
      Reactions are added one at a time at random, keeping the network
      conservative: an algorithm checks that a semi-positive mass vector m
      with S^T m = 0 still exists. Generation stops when the mass vector
      becomes unique.
  A:
    reactor: ode
    dilution: "external nutrient inflow drives the system out of equilibrium"
  params:
    - {name: N, type: int, default: 10, role: structural, meaning: "number of chemical species"}
    - {name: R, type: int, role: structural, meaning: "number of reactions; generation stops slightly above N"}
    - {name: k_avg_mono, type: float, role: kinetic, meaning: "geometric mean of monomolecular forward constants: k = k_avg * 10^U(-s/2, s/2)"}
    - {name: k_avg_bi, type: float, role: kinetic, meaning: "same for bimolecular"}
    - {name: s, type: float, role: kinetic, meaning: "spread in decades of the log-uniform rate distribution"}
    - {name: kinetics, type: enum, default: mass-action, range: "mass-action | saturating", role: kinetic, meaning: "saturating kinetics models molecular crowding"}
    - {name: nutrient, type: enum, role: population, meaning: "which species receives the external flux"}
    - {name: density, type: float, role: population}
    - {name: seed, type: seed, role: stochastic}
  provides: [topology, stoichiometry, rate-constants, rate-law, energies, thermodynamic-consistency, mass-conservation, flow]
  generator_ready: yes
  phenomena: ["at equilibrium one chemical dominates as a function of density", "under nutrient flux all but one species reach constant concentration while one grows unbounded - a 'directed transformation machine' producing a putative membrane precursor"]
  notes: >
    Second key thermodynamic entry, and the easiest to implement: pure
    random generation with a conservativity check (semi-positive left
    nullvector of S) and backward rates fixed by detailed balance.
    Excellent first citizen for a `thermodynamically_consistent=True`
    generator family.

- id: nac
  name: Network Artificial Chemistry (NAC)
  origin: "Suzuki, 2007-2009"
  book: "11.3.3; folding 18.1.1"
  refs: ["[824]", "[825]", "[827]"]
  family: network
  kind: generator
  constructive: true
  S:
    repr: "nodes of a graph; each node is a string decodable into a program for a von Neumann machine housed in the node. Nodes are hydrophilic or hydrophobic."
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "graph rewiring: covalent and hydrogen bonds as directed edges, weak van der Waals interactions as undirected edges"
  A:
    reactor: graph-rewrite
    dilution: none
  params:
    - {name: n_nodes, type: int, role: population}
    - {name: hydrophilic_fraction, type: float, role: structural}
    - {name: initial_edges, type: matrix, role: spatial, meaning: "random initial wiring"}
    - {name: programs, type: callable, role: structural, meaning: "node programs; hand-designed splitase and replicase exist"}
  provides: [topology, space, sequence-structure-function]
  generator_ready: partial
  phenomena: ["node chains fold into clusters comparable to enzymes with a catalytic site", "hydrophilic clustering into a cell-like structure", "centrosome-driven cell division"]
  notes: "An abstract stand-in for water-mediated hydrophobic/hydrophilic interaction without atomistic cost."

- id: arn
  name: Artificial Regulatory Network (ARN)
  origin: "Banzhaf, 2003"
  book: "11.3.4; GRN modelling 18.4.3; morphogenesis 18.6.1"
  refs: ["[67]", "[68]", "[73]", "[478]", "[479]", "[480]", "[504]", "[521]", "[522]", "[172]"]
  family: network
  kind: generator
  constructive: false
  S:
    repr: "a single bitstring genome divided into 32-bit portions; genes are marked by a promoter and encode 32-bit proteins"
    definition: implicit
  R:
    definition: implicit
    arity: variable
    scheme: >
      A 160-bit gene (5 x 32-bit segments) is translated to a 32-bit protein
      by MAJORITY VOTING over the 5 segments, bit by bit. Proteins act as
      TFs binding the enhancer and inhibitor sites upstream of each promoter;
      binding strength grows with bitwise complementarity (XOR popcount).
  A:
    reactor: ode
    dilution: "concentrations normalised: sum_i c_i = 1"
    notes: >
      dc_i/dt = delta (a_i - h_i) c_i / sum_j c_j
      a_i = (1/N) sum_j c_j exp(beta (d^a_j - d_max))
      h_i = (1/N) sum_j c_j exp(beta (d^h_j - d_max))
      Maps onto Arrhenius with E_a = d_max - d_j and beta = RT.
  params:
    - {name: genome_length, type: int, role: structural}
    - {name: promoter_pattern, type: matrix, default: "a fixed 32-bit pattern", role: structural, meaning: "what marks a gene; its density controls how many genes a random genome carries"}
    - {name: segments_per_gene, type: int, default: 5, role: structural}
    - {name: protein_len, type: int, default: 32, role: structural}
    - {name: d_max, type: int, default: 32, role: structural}
    - {name: beta, type: float, role: kinetic, meaning: "matching-strength scaling; the RT analogue"}
    - {name: delta, type: float, role: kinetic, meaning: "overall rate scaling"}
    - {name: link_threshold, type: float, role: structural, meaning: "complementarity above which a regulatory edge is drawn in the static topology"}
    - {name: genome_source, type: enum, default: random, range: "random | gene-duplication-and-divergence", role: structural, meaning: "duplication+divergence is what yields small-world and scale-free topologies; random genomes give nothing interesting"}
  provides: [topology, rate-law, energies, initial-state, sequence-structure-function]
  generator_ready: yes
  reference_impl: "described fully in the book; several independent implementations exist"
  phenomena: ["scale-free / small-world topology under duplication+divergence", "attractor dynamics dominated by a subset of genes", "network motifs matching natural GRNs", "heterochrony", "evolvable to target concentration dynamics"]
  notes: >
    Important edge case for the output schema: the ARN's dynamics is NOT
    mass action on a stoichiometric matrix - it is a normalised
    exponential-response ODE. Exporting only S loses the model entirely.

- id: squirm3
  name: Squirm3
  origin: "Hutton, 2002-2007"
  book: "11.4.1"
  refs: ["[411]", "[412]", "[529]"]
  family: spatial
  kind: generator
  constructive: true
  S:
    repr: "atoms with a type T in {a..f} and an integer state S; molecules are bonded atom groups moving as a unit"
    definition: implicit
  R:
    definition: explicit
    arity: [2, 3]
    scheme: >
      Three reaction classes: association (x_g + y_h -> x_i y_j),
      dissociation (x_g y_h -> x_i + y_j) and transformation
      (state changes in bonded pairs). Rules may be *specific* (fixed types)
      or *general* (type variables). Enzymatic reactions add a catalyst
      z(i) whose state i encodes the entire reaction via
      i = 2(2(|T|(|T|(|S|(|S|(|S| g + h) + j) + k) + x) + y) + b1) + b2 + S,
      and i is read from a base-4 genetic string over {a,b,c,d}.
  A:
    reactor: [lattice-2d, continuous-space]
    dilution: "periodic flooding erases regions and replenishes single atoms"
    notes: "Moore or von Neumann neighbourhood on a grid, or a reaction radius in continuous space"
  params:
    - {name: T, type: enum, default: "a b c d e f", role: structural, meaning: "atom types; |T| enters the enzyme encoding"}
    - {name: S, type: int, role: structural, meaning: "number of atom states; also enters the encoding"}
    - {name: rules, type: callable, role: structural, meaning: "the rule table; the book's self-replicator uses R1..R8 (table 11.5), the membrane version 41 rules"}
    - {name: space, type: enum, default: grid, range: "grid-moore | grid-vn | continuous", role: spatial}
    - {name: reaction_radius, type: float, role: spatial}
    - {name: flood_period, type: int, role: selection, meaning: "how often regions are wiped and refilled - the selection pressure"}
    - {name: seed_molecule, type: matrix, default: "e8-a1-b1-f1", role: population}
  provides: [topology, stoichiometry, catalysts, space, mass-conservation, initial-state]
  generator_ready: yes
  phenomena: ["template self-replication of an arbitrary a..d sequence flanked by e and f", "genetically encoded enzymes", "membrane-enclosed replicating cells", "evolution under flooding"]
  notes: >
    Atoms are indivisible and never created or destroyed, so Squirm3 has a
    real atom-conservation law - a good positive control for Chemart's
    conservation-law detection.

- id: swarm-chemistry
  name: Swarm Chemistry
  origin: "Sayama, 2009-2011"
  book: "11.4.2"
  refs: ["[746]", "[747]", "[748]", "[749]", "[709]", "[259]"]
  family: spatial
  kind: generator
  constructive: false
  S:
    repr: "self-propelled particles in continuous 2D or 3D; a 'species' is a parameter tuple (a kinetic recipe), not a structure"
    definition: explicit
  R:
    definition: implicit
    arity: variable
    scheme: >
      Boid-like kinetic interaction rather than transformation: within
      radius R_i, steer to the local centre, align to the local mean
      velocity, avoid collisions, steer randomly; otherwise stray randomly;
      relax toward the type's normal speed.
  A:
    reactor: continuous-space
    dilution: none
  params:
    - {name: R_i, type: float, range: "0..300 px", role: spatial, meaning: "local perception radius"}
    - {name: Vn_i, type: float, range: "0..20 px/step", role: kinetic, meaning: "normal speed"}
    - {name: Vm_i, type: float, range: "0..40 px/step", role: kinetic, meaning: "maximum speed"}
    - {name: c1_i, type: float, range: "0..1 (1/step^2)", role: kinetic, meaning: "strength of cohesive force"}
    - {name: c2_i, type: float, range: "0..1 (1/step)", role: kinetic, meaning: "strength of aligning force"}
    - {name: c3_i, type: float, range: "0..100 (px^2/step^2)", role: kinetic, meaning: "strength of separating force"}
    - {name: c4_i, type: float, range: "0..0.5", role: stochastic, meaning: "probability of random steering"}
    - {name: c5_i, type: float, range: "0..1", role: kinetic, meaning: "tendency of self-propulsion"}
    - {name: recipe, type: matrix, role: population, meaning: "list of (count, R, Vn, Vm, c1..c5) per particle type"}
  provides: [space, rate-law]
  generator_ready: yes
  phenomena: ["segregation", "oscillatory and rotating collective motion", "cell-division-like behaviour with two particle types", "3D variants"]
  notes: >
    IMPORTANT NEGATIVE CASE for the output schema: swarm chemistry has NO
    stoichiometry at all. Species are never created or destroyed; the
    "reaction" is a force law. Chemart must be able to declare
    `provides: [space, rate-law]` with an empty stoichiometric matrix and
    still export something useful (the force law + recipe).

- id: flow-ac
  name: Flow artificial chemistry
  aliases: ["reaction flow artificial chemistry"]
  origin: "Kreyssig & Dittrich, 2011"
  book: "11.4.3"
  refs: ["[474]"]
  family: spatial
  kind: generator
  constructive: false
  S:
    repr: "ordinary molecular species placed in a 2D domain and moved along a vector field"
    definition: explicit
  R:
    definition: explicit
    arity: [1, 2, 3]
    scheme: >
      Book figure 11.23 network (a, b, c, d): a + b -> a + 2b ; a + d -> a + 2d ;
      b + c -> 2c ; c -> b ; b + d -> c ; b -> ; c -> ; d -> . Molecules move
      x -> x + V(x) each iteration and react only with neighbours within a radius.
  A:
    reactor: [continuous-space, ssa]
    dilution: none
    notes: "stochastic particle simulation, or the PDE d[m]/dt = -<grad([m] |V|), V>/|V| + reaction terms"
  params:
    - {name: example, type: enum, default: swirl, choices: [swirl, radial, membrane, compartments], role: structural, meaning: "which example of the paper: swirl (book figure 11.23) and radial use network R1; membrane is a membrane-forming core (R2); compartments is rock-scissors-paper (R3) in two stirred regions"}
    - {name: k, type: float, default: 1.0, min: 0, role: kinetic, meaning: "mass-action rate constant for every reaction (the paper's PDE example uses 1)"}
  provides: [topology, stoichiometry, catalysts, rate-constants, space]
  fidelity: reconstructed
  sources:
    - "Kreyssig, P. & Dittrich, P. (2011). Reaction flow artificial chemistries. Proc. ECAL 2011, MIT Press, 431-437. Preprint: https://web.archive.org/web/2015/http://www.personal.uni-jena.de/~lo94wav/rfac.pdf"
  decisions:
    - "The book gives no reactions. The networks R1, R2 and R3 are the paper's; R1's mass-action form is confirmed by the paper's PDE reaction terms (all k = 1), which the tests reproduce. The fourth example (E. coli central sugar metabolism, 92 species and 198 reactions) is not reproduced in the paper and is not offered."
    - "R2 is printed as alpha p1 + beta p2 + gamma p3 -> m for alpha, beta, gamma in {0, 1}. The all-zero case (-> m) is excluded, because with it the empty set would not be closed, contradicting the paper's organisations O = {{}, {m}, {m, p1, p2, p3}}."
    - "Vector fields and simulation settings (molecules n, initial radius rad, reaction radius r, reacting fraction u, iterations) are recorded per example in extras.space, as strings and numbers; Chemart does not simulate them. The swirl field's square roots were lost in the PDF text and are read as V1 = (1/sqrt 2)((1 - sqrt 2) x - y, x + (1 - sqrt 2) y), an inward spiral. For the swirl example the paper states both 2500 starting molecules and n = 1600; 2500 is recorded."
    - "The previous parameters reactions, flow_field, diffusion and n_species are replaced by `example` and `k`: the paper uses flow instead of diffusion, and the networks are fixed per example. R2 and R3 carry no rates in the paper; they use the same k."
  phenomena: ["strongly inhomogeneous species distributions produced purely by transport (patches of b in the swirl)", "a membrane of m around a producer core, matching the organisations {m} and {m, p1, p2, p3}", "two compartments forming from rock-scissors-paper competitors"]
  notes: >
    Complements Swarm Chemistry: here motion is external and passive.
    Together they cover the two ways space enters an AC.
