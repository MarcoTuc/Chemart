chemistries:

- id: logistic-chemistry
  name: Logistic growth ('replicate and fight')
  intuition: >
    Logistic growth expressed as two reactions: X duplicates, and two X's
    collide to leave one. The second reaction supplies the crowding term, so
    the population approaches its carrying capacity without any bound being
    imposed. Worth keeping because the deterministic and stochastic readings
    genuinely differ - a stochastic run fluctuates around the capacity and can
    overshoot it, since nothing in the rules forbids that.
  book: "7.2.4; appendix (Logistic.py)"
  refs: ["[621]"]
  family: evolutionary-dynamics
  archived: pruned
  kind: generator
  constructive: false
  S: {repr: "one species X", definition: explicit}
  R:
    definition: explicit
    arity: [1, 2]
    scheme: "X --r--> 2X ; 2X --r/K--> X"
  A: {reactor: [ode, ssa], dilution: "implicit, via the reverse reaction"}
  params:
    - {name: r, type: float, default: 1.0, min: 0, role: kinetic, meaning: "intrinsic growth rate"}
    - {name: K, type: float, default: 1.0, min: 1.0e-9, role: population, meaning: "carrying capacity; the reverse coefficient is d = r/K"}
    - {name: x0, type: float, default: 0.1, min: 0, role: population, meaning: "initial population"}
  provides: [topology, stoichiometry, catalysts, rate-constants, initial-state]
  fidelity: book+decisions
  decisions:
    - "K = 1 as in figure 7.2; r and x0 are not given (defaults 1 and 0.1)."
  reference_impl: "PyCellChemistry Logistic.py"
  phenomena: ["sigmoid approach to K under ODE", "stochastic runs fluctuate around and OVERSHOOT K - the reaction does not enforce a hard bound"]
