# Chapters 16-17: ACs applied to engineering problems, and chemical computing.
# These are the entries most likely to be used as *programs*, so their
# parameterisation is dominated by problem instances rather than physics.
chemistries:

- id: fraglets
  name: Fraglets
  origin: "Tschudin, 2003"
  book: "16.2.1, 17.3.1; appendix (Fraglets.py, NetFraglets.py)"
  refs: ["[862]", "[575]", "[576]", "[577]", "[578]", "[579]", "[580]", "[581]", "[594]", "[595]", "[864]", "[914]", "[935]", "[936]", "[942]", "[943]", "[753]"]
  family: application
  kind: generator
  constructive: true
  S:
    repr: "strings (fraglets) of symbols; the head symbols are the instruction, the tail is data. A fraglet is simultaneously a data packet and a program fragment."
    definition: implicit
  R:
    definition: implicit
    arity: [1, 2]
    scheme: >
      Unimolecular: dup [dup A B t] -> [A B B t]; exch [exch A B C t] -> [A C B t];
      nop [nop t] -> [t]; split [split s1 * t] -> [s1],[t]; send A[send B t] -> B[t].
      Bimolecular: match [match A t1],[A t2] -> [t1 t2];
      matchp [matchp A t1],[A t2] -> [matchp A t1],[t1 t2] (catalytic/persistent).
    notes: "rules operate only on the FRONT symbols, which is what makes execution cheap and mirrors packet-header processing"
  A:
    reactor: [compartments, ssa]
    dilution: "originally maximally parallel; later mass-action scheduling with Gillespie SSA / next reaction method across a network of vessels"
    notes: "each network node is a reaction vessel; send moves a fraglet between vessels"
  params:
    - {name: topology, type: matrix, role: spatial, meaning: "network graph of nodes/vessels"}
    - {name: seed_code, type: matrix, role: population, meaning: "the persistent (catalytic) program fraglets injected at each node"}
    - {name: rate_constants, type: matrix, role: kinetic, meaning: "per-rule k; essential - the maximally parallel semantics was abandoned because autocatalytic growth, decay, replicator competition and diffusion speed all depend on rates"}
    - {name: scheduler, type: enum, default: ssa, range: "maximal-parallel | ssa | next-reaction", role: structural}
  provides: [topology, stoichiometry, catalysts, rate-constants, compartments, initial-state, sequence-structure-function]
  generator_ready: yes
  reference_impl: "PyCellChemistry Fraglets.py / NetFraglets.py; upstream Fraglets simulator"
  phenomena: ["Confirmed Delivery Protocol as an active protocol that carries its own code", "flow control with credits", "self-healing multipath routing", "resilient link load balancing", "autocatalytic recovery from code-deletion attacks", "known evolvability problems: code bloat, tail buildup, broken pathways"]

- id: disperser
  name: Chemical disperser (load balancing)
  origin: "Meyer & Tschudin, 2009"
  book: "17.3.1; appendix (Disperser.py)"
  refs: ["[576]", "[580]", "[941]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "job molecules X_i (one species per node) and catalysts C_i_j (one per directed link, located at node i)", definition: explicit}
  R:
    definition: explicit
    arity: 2
    scheme: "C_ij + X_i --k--> C_ij + X_j, for all (i,j) in E"
  A: {reactor: [ssa, compartments], dilution: none}
  params:
    - {name: graph, type: list, default: [[1, 2], [1, 3], [1, 4], [2, 3]], role: spatial, meaning: "undirected links [u, v] of the network; every link carries a catalyst in each direction"}
    - {name: k, type: float, default: 1.0, min: 0, role: kinetic, meaning: "rate coefficient, the same for all links; node degree then sets the outflow rate"}
    - {name: catalyst_concentration, type: float, default: 1.0, min: 0, role: population, meaning: "concentration of every catalyst C_i_j, held constant and equal everywhere"}
    - {name: initial_jobs, type: dict, default: {"4": 1000}, role: population, meaning: "node id (as a string) -> initial number of job molecules; other nodes start empty"}
  provides: [topology, stoichiometry, catalysts, rate-constants, compartments, initial-state]
  fidelity: book+decisions
  decisions:
    - "The book's 4-node topology (figure 17.3) is only drawn. Edges 1-2, 1-3, 1-4, 2-3 are the graph consistent with the text: after injection at node 4, nodes 2 and 3 are the farthest; after injection at node 2, node 4 is."
    - "Catalyst concentration is not given numerically; default 1. extras.compartments maps each node to its X and outgoing C species."
  reference_impl: "PyCellChemistry Disperser.py"
  phenomena: ["provable convergence to the network-wide average x_bar = sum_i x_i(0)/n, stable under injection and deletion (1000 jobs on 4 nodes -> 250 each)"]
  notes: >
    The cleanest 'chemistry as a provable distributed algorithm' example:
    mass conservation means the algorithm can never produce a negative
    load, and the ODE can be checked for convergence and stability directly.

- id: molecular-tsp
  name: Molecular Traveling Salesman
  origin: "Banzhaf, 1990-1995"
  book: "17.2.1"
  refs: ["[62]"]
  family: application
  kind: generator
  constructive: true
  S: {repr: "data strings s = (s0, s1..sN) where s0 is the fitness and s1..sN a tour permutation; plus machine molecules", definition: implicit}
  R:
    definition: implicit
    arity: [2, 3]
    scheme: >
      A machine picks n_op strings, modifies them, evaluates
      l(s) = sum_i sqrt((x_{i+1}-x_i)^2 + (y_{i+1}-y_i)^2), and releases
      the n_op best. Machine types: E (exchange two cities), C (cut and
      reinsert a segment), I (cut, invert and reinsert), R (recombine two
      tours; n_op = 2).
  A: {reactor: well-stirred-multiset, dilution: "worse strings discarded by the machine"}
  params:
    - {name: N, type: int, role: structural, meaning: "number of cities"}
    - {name: M, type: int, role: population, meaning: "number of data strings"}
    - {name: machine_counts, type: matrix, role: structural, meaning: "how many E-, C-, I-, R-machines; the R fraction trades convergence speed for diversity"}
    - {name: city_coords, type: matrix, role: structural, meaning: "the problem instance"}
    - {name: fitness_fn, type: callable, role: selection, meaning: "swap this and the same chemistry solves other problems"}
  provides: [topology, sequence-structure-function]
  generator_ready: yes
  reference_impl: "re-implemented by the authors on PyCellChemistry"
  phenomena: ["convergence to near-optimal tours by purely local machine-string collisions, with no global information"]

- id: ccm
  name: Chemical Casting Model (CCM)
  origin: "Kanada, 1992-1994"
  book: "17.2.2"
  refs: ["[438]", "[439]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "atoms with a type and a state, optionally connected by links; the whole working memory is ONE point in search space", definition: explicit}
  R:
    definition: explicit
    arity: variable
    scheme: "LHS -> RHS pattern rewriting, applied only if the sum of Local Order Degrees increases"
  A:
    reactor: well-stirred-multiset
    dilution: none
    notes: "an annealing variant adds a per-atom 'frustration' (kinetic energy) that is added to the LOD and lets uphill moves happen; frustration grows by a factor c on each elastic collision and resets on reaction"
  params:
    - {name: problem, type: enum, range: "graph-colouring | N-queens | TSP", role: structural}
    - {name: LOD, type: callable, role: selection, meaning: "local order degree: a 1-atom or 2-atom evaluation function; only LOCAL quality is measured"}
    - {name: c, type: float, role: stochastic, meaning: "frustration growth factor (annealing rate)"}
    - {name: catalysts, type: bool, default: false, role: structural, meaning: "adding a catalyst reduces rule locality -> faster convergence but more local optima"}
  provides: [topology, sequence-structure-function]
  generator_ready: partial
  phenomena: ["convergence to global optima despite purely local evaluation", "near-lock-free parallelism: access conflicts act as harmless low-intensity noise"]

- id: acgp
  name: Algorithmic Chemistry GP (ACGP)
  aliases: ["sequenceless register machine programs"]
  origin: "Banzhaf & Lasarczyk, 2004-2008"
  book: "16.6"
  refs: ["[74]", "[75]", "[497]", "[498]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "registers of a virtual machine (species) and their contents (concentrations)", definition: explicit}
  R:
    definition: explicit
    arity: variable
    scheme: "an instruction r3 <- r1 op r2 is read as a reaction r1 + r2 -> r3"
  A:
    reactor: well-stirred-multiset
    dilution: none
    notes: "start() picks a random instruction and next() steps randomly - the program is a MULTISET of instructions with no execution order, so behaviour is the average over orderings"
  params:
    - {name: n_registers, type: int, role: structural}
    - {name: n_instructions, type: int, default: 100, role: structural, meaning: "multiset size; multiplicity of an instruction = its importance, which gives fault tolerance"}
    - {name: input_registers, type: matrix, role: structural, meaning: "read-only"}
    - {name: output_registers, type: matrix, role: structural, meaning: "read-write; where the answer is read from"}
    - {name: executions_per_eval, type: float, default: 5, role: population, meaning: "multiple of the instruction count executed per fitness evaluation"}
    - {name: population, type: int, default: 100, role: population}
    - {name: generations, type: int, default: 500, role: population}
  provides: [topology, stoichiometry]
  generator_ready: yes
  phenomena: ["evolves classifiers (e.g. UCI thyroid) as bipartite register/instruction graphs", "robust to instruction deletion", "trivially parallelisable - no coordination between instruction executions"]
  notes: >
    Interesting inverse case for Chemart: here a CRN is READ OUT of a
    program rather than generated. The exported bipartite graph
    (registers = species diamonds, instructions = reaction hexagons) is
    exactly the SBML/BioNetGen bipartite view.

- id: metabolic-robot-controller
  name: Metabolic / artificial biochemical network robot controllers
  origin: "Ziegler & Banzhaf, 2001; Lones, Fuente, Turner et al."
  book: "16.1.3"
  refs: ["[958]", "[959]", "[519]", "[520]", "[68]", "[660]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "abstract substances; sensor readings are injected as molecules, motor commands are read from product concentrations", definition: explicit}
  R:
    definition: explicit
    arity: variable
    scheme: >
      Bipartite directed weighted graph G = (V, E), V = R u S with R the
      reactions and S the substances; edges alternate types; special edges
      S -> R carry catalytic or inhibitory weights k_i in [k_min, k_max],
      ordinary edges carry a default k_0. Material balance is enforced.
  A: {reactor: ode, dilution: none}
  params:
    - {name: n_substances, type: int, role: structural}
    - {name: n_reactions, type: int, role: structural}
    - {name: k_min, type: float, role: kinetic}
    - {name: k_max, type: float, role: kinetic}
    - {name: k_0, type: float, role: kinetic, meaning: "default weight of stoichiometric edges"}
    - {name: sensor_map, type: callable, role: structural, meaning: "which sensors inject which species"}
    - {name: actuator_map, type: callable, role: structural, meaning: "which species drive which motors"}
    - {name: evolution, type: enum, default: gp, range: "hand-designed | genetic-programming", role: selection}
  provides: [topology, stoichiometry, catalysts, rate-constants, mass-conservation]
  generator_ready: partial
  phenomena: ["light seeking and obstacle avoidance on a Khepera robot", "evolved networks transfer between simulation and hardware up to a scale factor", "combined genetic + metabolic + signalling networks controlling chaotic dynamical systems"]
  notes: >
    The book gives an explicit graph grammar including the mass-balance
    constraint and a shortest-path 'metabolic pathway' extraction
    procedure. That pathway extraction is worth exposing as a Chemart
    analysis: subgraph P(v,w) containing only nodes on the shortest path
    from v to w, with every reaction on the path participating.

- id: naming-game-ac
  name: Naming game as an artificial chemistry
  origin: "De Beule, Hovig & Benson (book ref [212]); after Steels' naming games"
  book: "16.3.3"
  refs: ["[212]", "[804]", "[805]", "[806]", "[809]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "one meaning molecule M, word molecules S_j and adaptor/code molecules C_j for j = 1..N_s", definition: explicit}
  R:
    definition: explicit
    arity: [2, 3]
    scheme: >
      M + C_j --ks--> S_j ; M + S_j --kc--> C_j ;
      M + S_j + C_j --ka--> 2 S_j ;
      M + S_j + C_k --kappa1--> M + S_j + C_j ;
      M + S_k + C_j --kappa2--> M + S_j + C_j   (k != j)
  A: {reactor: ode, dilution: none}
  params:
    - {name: N_s, type: int, default: 3, min: 1, max: 20, role: structural, meaning: "number of competing names for the meaning"}
    - {name: ks, type: float, default: 1.0, min: 0, role: kinetic, meaning: "word production M + C_j -> S_j"}
    - {name: kc, type: float, default: 1.0, min: 0, role: kinetic, meaning: "code production M + S_j -> C_j"}
    - {name: ka, type: float, default: 1.0, min: 0, role: kinetic, meaning: "replication of a successful word"}
    - {name: kappa1, type: float, default: 1.0, min: 0, role: kinetic, meaning: "replacement of a mismatching adaptor"}
    - {name: kappa2, type: float, default: 1.0, min: 0, role: kinetic, meaning: "replacement of a mismatching word"}
  provides: [topology, stoichiometry, catalysts, rate-constants]
  fidelity: book+decisions
  decisions:
    - "In the text of eqs. 16.5-16.6 the mismatch marks are lost (both read M + S_j + C_j -> M + S_j + C_j). Following the prose ('eliminate mismatching words (resp. adaptors) by replacing them with matching ones'), they are M + S_j + C_k -> M + S_j + C_j and M + S_k + C_j -> M + S_j + C_j for every k != j."
    - "Reactions 16.2-16.4 consume M as printed. The book gives no rate values or initial state; all rates default to 1 and no initial state is attached."
  phenomena: ["lateral inhibition dynamics converging to a shared lexicon, reproducing Steels' agent-based results in ODE form"]

- id: music-ac
  name: Algorithmic chemistry for music composition
  origin: "Miyamoto & Tominaga (homophonic); Tominaga et al. (polyphonic)"
  book: "16.4"
  refs: ["[592]", "[854]"]
  family: application
  kind: generator
  constructive: true
  S: {repr: "musical patterns: note sequences and chords", definition: implicit}
  R:
    definition: implicit
    arity: 2
    scheme: "pattern combination rules, with harmonic filters rejecting dissonant combinations"
  A: {reactor: well-stirred-multiset, dilution: none}
  params:
    - {name: mode, type: enum, range: "homophonic | polyphonic", role: structural}
    - {name: harmony_filter, type: callable, role: selection}
    - {name: seed_patterns, type: matrix, role: population}
  provides: [topology, sequence-structure-function]
  generator_ready: no
  notes: "Described only qualitatively in the book; needs the primary sources."

- id: proof-ac
  name: Artificial chemistry as a proof search system
  origin: "Fontana & Buss (Curry-Howard link); Bersini / Casti (book refs [147],[148])"
  book: "16.5"
  refs: ["[284]", "[147]", "[148]", "[406]", "[620]"]
  family: application
  kind: generator
  constructive: true
  S: {repr: "clauses of first-order predicate calculus (or lambda-terms, under the Curry-Howard isomorphism)", definition: implicit}
  R:
    definition: implicit
    arity: 2
    scheme: "binary resolution: two clauses unify and produce a new clause; existence of a molecule = truth of the proposition"
  A: {reactor: well-stirred-multiset, dilution: "dead-end clauses accumulate; the proof is read off the construction sequence"}
  params:
    - {name: axioms, type: matrix, role: population, meaning: "the theory A = {A_1..A_n}"}
    - {name: target, type: matrix, role: selection, meaning: "the proposition P to prove"}
    - {name: max_collisions, type: int, role: population}
  provides: [topology, sequence-structure-function]
  generator_ready: partial
  phenomena: ["parallel, stochastic proof search; the proof is the reaction pathway that produced the target molecule"]

- id: okamoto-switch
  name: Okamoto's biochemical switch
  origin: "Okamoto, Sakai & Hayashi, 1987-1993"
  book: "17.4.1"
  refs: ["[632]", "[633]", "[634]", "[635]", "[631]", "[386]", "[387]", "[539]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "inputs I1, I2; substrates X1..X4; enzyme cofactors A and B (the outputs)", definition: explicit}
  R:
    definition: explicit
    arity: [1, 2]
    scheme: >
      I1 -> X1 ; I2 -> X3 ; A + X3 --k2--> B + X4 ; B + X1 --k1--> A + X2 ;
      X2 --k3--> ; X4 --k4--> ; plus I1 -> I2 to drive the inputs across each other
  A: {reactor: ode, dilution: "X2 and X4 decay out"}
  params:
    - {name: k1, type: float, default: 5.0e+4, min: 0, role: kinetic, meaning: "B + X1 -> A + X2"}
    - {name: k2, type: float, default: 5.0e+4, min: 0, role: kinetic, meaning: "A + X3 -> B + X4"}
    - {name: k3, type: float, default: 10.0, min: 0, role: kinetic, meaning: "decay of X2"}
    - {name: k4, type: float, default: 10.0, min: 0, role: kinetic, meaning: "decay of X4"}
    - {name: k_in, type: float, default: 1.0, min: 0, role: kinetic, meaning: "production of X1 from I1 and of X3 from I2"}
    - {name: k_conv, type: float, default: 0.006, min: 0, role: kinetic, meaning: "conversion I1 -> I2; sets when the inputs cross and hence the switching time"}
    - {name: I1_0, type: float, default: 100.0, min: 0, role: population, meaning: "initial concentration of input I1"}
    - {name: I2_0, type: float, default: 80.0, min: 0, role: population, meaning: "initial concentration of input I2"}
  provides: [topology, stoichiometry, catalysts, rate-constants, initial-state]
  fidelity: book+decisions
  decisions:
    - "Inputs are 'controlled externally ... not affected although consumed' (book), so input reactions are written I1 -> I1 + X1 and I2 -> I2 + X3, with rate k_in (not given in the book; default 1)."
    - "The book's I1/I2 profiles are reproduced as in its simulation: I1(0) = 100, I2(0) = 80 and an irreversible I1 -> I2. k_conv = 0.006 makes the inputs cross at about 17.5 s, as in figure 17.5 (top)."
    - "Known discrepancy: with the reactions as printed, X1 (X3) is never lost while A (B) is saturated, so surplus substrate accumulates and the flip lags the crossing by ~18 s at the defaults, instead of 'a few seconds' in figure 17.5. The original cyclic-enzyme model [633] has reversible enzyme steps and substrate influx/efflux that the book omits; the paper was not accessible, so the book's scheme is kept."
    - "Other initial concentrations are the book's: X1 = X3 = 0, X2 = X4 = 8, A = 1, B = 0."
  phenomena: ["bistability: A and B flip within seconds of the inputs crossing", "switching time tunable via the input conversion rate", "composable into chemical neurons, logic gates, finite state machines and a Turing-universal chemical computer"]

- id: brusselator
  name: Brusselator
  origin: "Prigogine & Lefever, 1968"
  book: "17.4.2, 19.3; ARMS 9.4"
  refs: ["[675]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "A, B (buffered), X, Y (dynamic), D, E (waste)", definition: explicit}
  R:
    definition: explicit
    arity: [1, 2, 3]
    scheme: "A --k1--> X ; B + X --k2--> Y + D ; 2X + Y --k3--> 3X ; X --k4--> E"
  A: {reactor: [ode, ssa], dilution: "A and B held constant by buffering"}
  params:
    - {name: a, type: float, default: 1.0, min: 0, role: population, meaning: "[A], held constant"}
    - {name: b, type: float, default: 3.0, min: 0, role: population, meaning: "[B], held constant; sustained oscillations require b > 1 + a^2 when all k_i = 1"}
    - {name: k1, type: float, default: 1.0, min: 0, role: kinetic, meaning: "A -> X"}
    - {name: k2, type: float, default: 1.0, min: 0, role: kinetic, meaning: "B + X -> Y + D"}
    - {name: k3, type: float, default: 1.0, min: 0, role: kinetic, meaning: "2X + Y -> 3X"}
    - {name: k4, type: float, default: 1.0, min: 0, role: kinetic, meaning: "X -> E"}
  provides: [topology, stoichiometry, catalysts, rate-constants, initial-state]
  fidelity: book
  decisions:
    - "Buffered species A and B are listed in extras.buffered: their concentrations stay at a and b although the reactions consume them. Initial X, Y, D, E are 0, as in figure 17.6."
  phenomena: ["limit-cycle oscillations for b > 1 + a^2 (all k_i = 1); damped oscillations to (X, Y) = (a, b/a) below"]
  notes: "The trimolecular step 2X + Y -> 3X is physically unrealistic; the book keeps it because it simplifies the analysis. A good test that Chemart handles arity-3 reactions and the associated l_i! factor in the k->c conversion."

- id: analog-function-crn
  name: Analog computation of algebraic functions with concentrations
  origin: "Hjelmfelt et al.; Deckard & Sauro; Dittrich et al."
  book: "17.4.3"
  refs: ["[141]", "[220]", "[511]", "[386]"]
  family: application
  kind: generator
  constructive: false
  S: {repr: "one species per input (X1, X2) and the output Y; values are concentrations", definition: explicit}
  R:
    definition: explicit
    arity: [1, 2]
    scheme: "sqrt: X --k1--> X + Y ; 2Y --k2--> (nothing), giving y = sqrt(k1 x / (2 k2)); k1 = 2 k2 gives y = sqrt(x)"
  A: {reactor: ode, dilution: "the result is read at steady state"}
  params:
    - {name: function, type: enum, default: sqrt, choices: [sqrt, square, add, multiply, divide], role: structural, meaning: "the function computed at steady state as [Y]"}
    - {name: x1, type: float, default: 4.0, min: 0, role: population, meaning: "first input concentration"}
    - {name: x2, type: float, default: 2.0, min: 0, role: population, meaning: "second input concentration (add, multiply, divide)"}
  provides: [topology, stoichiometry, catalysts, rate-constants, initial-state]
  fidelity: book+decisions
  decisions:
    - "sqrt is the book's network with k1 = 2, k2 = 1 (eqs. 17.18-17.24)."
    - "The other functions are not in the book. They are the analogous mass-action networks, each checked against its steady state in the tests: square 2X1 -> 2X1 + Y, Y -> ; add X1 -> X1 + Y, X2 -> X2 + Y, Y -> ; multiply X1 + X2 -> X1 + X2 + Y, Y -> ; divide X1 -> X1 + Y, X2 + Y -> X2."
    - "extras.readout names the output species and its expected steady state."
  notes: >
    The book lists the shortcomings honestly: no negative numbers, must
    wait for steady state, not every system HAS a steady state, and
    composition needs disjoint species per stage, which does not scale.

- id: organization-computing
  name: Computing with chemical organizations
  origin: "Matsumaru, Speroni di Fenizio, Centler & Dittrich, 2006-2011"
  book: "17.3.3"
  refs: ["[550]", "[551]", "[552]", "[553]", "[554]", "[555]", "[506]"]
  family: application
  kind: generator
  constructive: false
  S:
    repr: "two species per Boolean variable: x0 for x=0 and x1 for x=1; information is encoded by PRESENCE/ABSENCE, not concentration"
    definition: explicit
  R:
    definition: explicit
    arity: variable
    scheme: >
      XOR gate: a0+b0 -> c0 ; a0+b1 -> c1 ; a1+b0 -> c1 ; a1+b1 -> c0,
      plus annihilation x0 + x1 -> (nothing) for each variable.
      Maximal independent set: s0_j + s1_j -> ;
      s0_j + s0_k + ... + s0_l -> n_i s1_i (over the n_i neighbours of v_i) ;
      s1_j -> s0_i for all (v_j, v_i) in E.
  A: {reactor: [ode, ssa], dilution: none}
  params:
    - {name: problem, type: enum, default: xor, choices: [xor, maximal-independent-set], role: structural, meaning: "which chemical program of the book to generate"}
    - {name: a, type: bool, default: false, role: population, meaning: "XOR input a; its species a0 or a1 is put in the initial state"}
    - {name: b, type: bool, default: true, role: population, meaning: "XOR input b; its species b0 or b1 is put in the initial state"}
    - {name: graph, type: list, default: [[0, 1], [1, 2], [2, 3]], role: structural, meaning: "undirected edges [u, v] of the maximal-independent-set instance"}
  provides: [topology, stoichiometry, initial-state]
  fidelity: book+decisions
  decisions:
    - "No rates: the book's analysis is organisational (which species survive), not kinetic."
    - "The book gives no MIS instance; the default graph is a 4-vertex path. Edges are undirected, so eq. 17.7 applies in both directions. Inputs a and b only affect the XOR program."
  phenomena: ["the surviving organisation IS the answer; 15 organisations in the XOR Hasse diagram", "flip-flops, oscillators, NAND chains", "robustness: perturbing the system makes it fall back into the solution organisation, an attractor"]
  notes: >
    Its shortcoming (one species per variable state) is precisely why the
    output schema needs to carry the ORGANISATION LATTICE as a first-class
    analysis product, not just the matrix.
