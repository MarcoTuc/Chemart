# Chapter 9: rewriting systems. Molecules are terms/strings/multisets and
# reactions are rewrite rules. Most entries here are FORMALISMS: they define
# a language, and a Chemart "chemistry" is an instance written in it.
chemistries:

- id: alchemy
  name: AlChemy (lambda-calculus chemistry)
  aliases: ["lambda chemistry", "Fontana's algorithmic chemistry"]
  origin: "Fontana, 1992; Fontana & Buss, 1994"
  book: "9.1"
  refs: ["[281]", "[282]", "[283]", "[284]"]
  family: rewriting
  kind: generator
  constructive: true
  S:
    repr: "normal forms of untyped lambda-expressions over A = {lambda, ., (, )} u V"
    definition: implicit
    notes: "molecules must be normal forms so that objects are stable"
  R:
    definition: implicit
    arity: 2
    scheme: "s1 + s2 -> s1 + s2 + NF((s1) s2)"
    notes: >
      Both reactants are catalysts. Since the untyped lambda-calculus is
      not strongly normalising, reduction is bounded by a time/memory
      budget; exceeding it makes the collision elastic.
  A:
    reactor: well-stirred-multiset
    dilution: "remove a random molecule per product; M constant"
  params:
    - {name: M, type: int, default: 1000, range: "1000..3000", role: population, meaning: "reactor size"}
    - {name: reduction_budget, type: int, role: structural, meaning: "max reduction steps / memory before declaring the collision elastic"}
    - {name: filter, type: enum, default: none, range: "none | no-copy (level 1) | no-copy+no-glue (level 2)", role: selection, meaning: "filter conditions; forbidding reactions that reproduce a reactant is what pushes the system from L0 to L1 organisations"}
    - {name: init_generator, type: callable, role: population, meaning: "random lambda-expression generator (depth/size distribution)"}
    - {name: seed, type: seed, role: stochastic}
  provides: [topology, catalysts, flow, sequence-structure-function]
  generator_ready: partial
  notes: >
    Fully specified conceptually, but the book does not fix the random
    lambda-term generator or the exact reduction budget - Chemart must
    choose and document these. Historically the most important AC:
    the notions of closure, self-maintenance and organisation come from here.
  phenomena: ["L0 organisations (a few coupled replicators forming a hypercycle)", "L1 organisations (large, possibly infinite, self-maintaining sets, stable against random injection)", "L2 organisations (two coexisting L1s coupled by 'glue' species)", "syntactic convergence of survivors - the system exhausts its novelty"]

- id: gamma
  name: Gamma / gamma-calculus
  aliases: ["general abstract multiset manipulation"]
  origin: "Banatre & Le Metayer, 1990; gamma-calculus: Banatre, Fradet & Radenac"
  book: "9.2"
  refs: ["[55]", "[56]", "[57]", "[58]"]
  family: rewriting
  kind: formalism
  constructive: false
  S:
    repr: "elements of a multiset (numbers, tuples, or - in the gamma-calculus - programs)"
    definition: explicit
  R:
    definition: explicit
    arity: variable
    scheme: "name : x1,...,xn -> y1,...,ym  <= C(x1,...,xn)   (reaction action guarded by a reaction condition)"
  A:
    reactor: maximally-parallel
    dilution: none
    notes: >
      Non-deterministic and order-independent; computation terminates when
      the multiset becomes inert. Re-injecting new input restarts it, so
      a Gamma program is a self-updating reactive system.
  params:
    - {name: rules, type: callable, role: structural, meaning: "the (action, condition) pairs"}
    - {name: initial_multiset, type: matrix, role: population}
    - {name: higher_order, type: bool, default: false, role: structural, meaning: "gamma-calculus: programs are themselves molecules (gamma(P)<C>.M)"}
  provides: [topology, sequence-structure-function]
  generator_ready: yes
  phenomena: ["max: x,y -> y <= x<=y", "sort: (i,x),(j,y) -> (i,y),(j,x) <= i>=j and x>=y", "primes: x,y -> y/x <= y mod x = 0"]
  notes: >
    Purely qualitative - no rate constants, no time. Useful to Chemart as
    a *front-end language* for writing explicit chemistries, and as the
    ancestor of Fraglets/CHAM/ARMS.

- id: cham
  name: Chemical Abstract Machine (CHAM)
  origin: "Berry & Boudol, 1990"
  book: "9.3"
  refs: ["[113]", "[422]"]
  family: rewriting
  kind: formalism
  constructive: false
  S:
    repr: "terms of an algebra; a whole solution can itself be enclosed by a membrane and become a molecule"
    definition: explicit
  R:
    definition: explicit
    arity: variable
    scheme: "s1,...,sk -> s1',...,sl' ; classified as heating (a -> b...c), cooling (a...c -> b), and reaction rules"
    notes: >
      Four general laws govern rule application: reaction, chemical law,
      membrane law (a subsolution evolves independently), airlock law
      (a molecule crosses a membrane: s1 <| M).
  A:
    reactor: [maximally-parallel, compartments]
    dilution: none
    notes: "arbitrarily many transformations per step provided no molecule is used twice; non-deterministic choice when several rules apply"
  params:
    - {name: heating_rules, type: callable, role: structural}
    - {name: cooling_rules, type: callable, role: structural}
    - {name: reaction_rules, type: callable, role: structural}
    - {name: membrane_structure, type: matrix, role: spatial}
  provides: [topology, compartments]
  generator_ready: yes
  notes: >
    Heating/cooling reversibility is a genuinely useful primitive for
    Chemart: it is the only place in the book where a rewriting formalism
    marks pairs of rules as thermodynamic inverses. Applied to industrial
    robot self-assembly in SOAS (see `soas`).

- id: arms
  name: ARMS (Abstract Rewriting System on Multisets)
  origin: "Suzuki & Tanaka, 1997"
  book: "9.4; ecology application 8.2.3; p53 model 18.3.2"
  refs: ["[830]", "[831]", "[832]", "[828]", "[829]"]
  family: rewriting
  kind: generator
  constructive: false
  S:
    repr: "symbols from a finite alphabet A"
    definition: explicit
  R:
    definition: explicit
    arity: variable
    scheme: "Gamma = (A, R) with R a set of indexed multiset rewriting rules r_1..r_n"
  A:
    reactor: [maximally-parallel, compartments]
    dilution: none
    notes: >
      A *rule order* determines the sequence of rule application; kinetics
      is modelled as differing rule-application frequencies rather than
      rate constants. Rewriting is sequential, free or parallel.
  params:
    - {name: alphabet, type: matrix, role: structural}
    - {name: rules, type: callable, role: structural}
    - {name: rule_order, type: matrix, role: structural, meaning: "priority ordering; reversing it turns a halting system into an exponentially expanding one"}
    - {name: M0, type: matrix, role: population, meaning: "initial multiset"}
    - {name: lambda_e, type: float, role: structural, meaning: "order parameter: ratio of heating to cooling rules; cycles emerge only at intermediate values (Langton-lambda analogue)"}
  provides: [topology, stoichiometry, compartments, initial-state]
  generator_ready: yes
  phenomena: ["halting vs. exponential expansion depending on rule order", "emergence of cycles at intermediate lambda_e", "Brusselator-like oscillations", "plant/herbivore/carnivore ecology", "p53 signalling feedback loops"]

- id: p-systems
  name: P systems (membrane computing)
  origin: "Paun, 1998"
  book: "9.5; multicompartment SSA 4.3; biology 18.3.2"
  refs: ["[678]", "[679]", "[680]", "[681]", "[683]", "[661]", "[718]"]
  family: rewriting
  kind: formalism
  constructive: false
  S:
    repr: "symbols over an alphabet Sigma; multisets written as strings (a^2 b^3 c)"
    definition: explicit
  R:
    definition: explicit
    arity: variable
    scheme: >
      multiset rewriting plus target indicators and membrane operations:
      'abc -> a_here b_out d_in_j', 'a -> b delta' (dissolve),
      '[a] -> [b][c]' (divide)
  A:
    reactor: [maximally-parallel, compartments, ssa]
    dilution: none
    notes: >
      Default algorithm: fire all applicable rules maximally in parallel
      until inert. The multicompartmental Gillespie algorithm (MGA) and
      variants replace this with rate-based scheduling for biological realism.
  params:
    - {name: Sigma, type: matrix, role: structural, meaning: "alphabet of objects"}
    - {name: mu, type: matrix, role: spatial, meaning: "membrane structure, e.g. [1 [2 ]2 [3 ]3 [4 [5 ]5 [6 ]6 [7 ]7 ]4 ]1"}
    - {name: w_i, type: matrix, role: population, meaning: "initial multiset in each region i"}
    - {name: R_i, type: callable, role: structural, meaning: "rule set per region"}
    - {name: rho_i, type: matrix, role: structural, meaning: "priority relation over rules in region i"}
    - {name: i_o, type: int, role: structural, meaning: "id of the output membrane"}
  provides: [topology, stoichiometry, compartments, initial-state]
  generator_ready: yes
  phenomena: ["Turing universality", "space-for-time tradeoff via membrane division / worm objects", "decision problems (e.g. is n a multiple of k)"]
  notes: >
    Formally Pi = (Sigma, mu, w_1..w_m, (R_1,rho_1)..(R_m,rho_m), i_o).
    The most important structured chemistry in the book for Chemart's
    purposes: it is where compartments enter the output schema.

- id: mgs
  name: MGS
  aliases: ["un modele general de simulation"]
  origin: "Giavitto & Michel, 2001"
  book: "9.6; biology 18.3.2"
  refs: ["[317]", "[319]", "[320]", "[321]", "[322]"]
  family: rewriting
  kind: formalism
  constructive: true
  S:
    repr: "topological collections: monoidal collections (sets, multisets, sequences), maps, labelled graphs / regular grids"
    definition: implicit
  R:
    definition: explicit
    arity: variable
    scheme: "trans name = { pattern / guard => replacement }  applied over a collection's neighbourhood structure"
  A:
    reactor: [graph-rewrite, maximally-parallel]
    dilution: none
    notes: "integrates CA, CHAM, P systems and L-systems into one rule system; targets dynamical systems with a dynamical structure, (DS)^2"
  params:
    - {name: collection_type, type: enum, range: "seq | bag | set | map | graph | grid", role: spatial}
    - {name: transformations, type: callable, role: structural}
  provides: [topology, space, compartments, sequence-structure-function]
  generator_ready: partial
  phenomena: ["neighbour-swap sort on a sequence", "EcoRI restriction-enzyme cleavage of a DNA sequence into a TUBE bag", "Anabaena filament growth", "cAMP signalling"]
  notes: "Chemart can borrow its collection typing as the space abstraction."

- id: kappa-calculus
  name: Kappa calculus
  origin: "Danos & Laneve, 2004"
  book: "9.7"
  refs: ["[208]"]
  family: rewriting
  kind: formalism
  constructive: true
  S:
    repr: "proteins with named binding sites; complexes are graphs"
    definition: implicit
  R:
    definition: explicit
    arity: 2
    scheme: "graph rewriting rules expressing binding and dissociation of proteins at specific sites"
  A:
    reactor: [ssa, graph-rewrite]
    dilution: none
  params:
    - {name: agent_signatures, type: callable, role: structural, meaning: "protein types and their binding sites"}
    - {name: rules, type: callable, role: structural}
    - {name: rates, type: matrix, role: kinetic}
  provides: [topology, stoichiometry, rate-constants, sequence-structure-function]
  generator_ready: partial
  notes: >
    Rule-based, combinatorially explosive species set - the archetype of a
    chemistry that must NOT be flattened to a stoichiometric matrix by
    default. Used for gene regulation, signal transduction, PPI networks.
    Real tooling exists outside the book (KaSim), so Chemart should
    interoperate rather than reimplement.

- id: brane-calculi
  name: Brane calculi
  origin: "Cardelli, 2004"
  book: "9.7"
  refs: ["[157]", "[269]"]
  family: rewriting
  kind: formalism
  constructive: true
  S:
    repr: "nested membranes; computation happens ON membranes rather than inside compartments"
    definition: implicit
  R:
    definition: explicit
    arity: variable
    scheme: "endocytosis, exocytosis, budding (membrane split), mating (membrane fusion)"
  A:
    reactor: compartments
    dilution: none
  params:
    - {name: membrane_actions, type: callable, role: structural}
    - {name: initial_structure, type: matrix, role: spatial}
  provides: [topology, compartments]
  generator_ready: no
  phenomena: ["viral infection", "molecular pumps", "ion channels", "transport of molecular cargo by synthetic containers"]
  notes: "Contrast with P systems: the membrane is the active element, not the container."

- id: l-systems
  name: L-systems
  origin: "Lindenmayer, 1968; Prusinkiewicz & Lindenmayer, 1990"
  book: "9.8"
  refs: ["[512]", "[677]", "[376]", "[443]"]
  family: rewriting
  kind: formalism
  constructive: true
  S:
    repr: "strings over an alphabet, interpreted as turtle commands"
    definition: implicit
  R:
    definition: explicit
    arity: 1
    scheme: "context-free or context-sensitive productions applied in PARALLEL (unlike formal grammars, which rewrite sequentially)"
  A:
    reactor: maximally-parallel
    dilution: none
  params:
    - {name: axiom, type: matrix, role: population}
    - {name: productions, type: callable, role: structural}
    - {name: iterations, type: int, role: population}
    - {name: stochastic, type: bool, default: false, role: stochastic}
  provides: [topology, space]
  generator_ready: yes
  notes: >
    Included for completeness. Growth/development, not chemistry: there is
    no conservation, no kinetics, and the "reaction" is unary. In Chemart
    it belongs in a `developmental` category with a warning that its
    stoichiometric export is degenerate.

- id: reflexive-ac
  name: Reflexive artificial chemistry
  origin: "Salzberg, 2007"
  book: "9.8"
  refs: ["[737]"]
  family: rewriting
  kind: generator
  constructive: true
  S:
    repr: "finite state machines and their input data, deconstructed into a graph"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "a graph rewrites a graph, and in principle itself"
  A:
    reactor: graph-rewrite
    dilution: none
  provides: [topology, sequence-structure-function]
  generator_ready: no
  notes: "Described in one sentence in the book; needs the primary source before implementation."

- id: combinator-chemistry
  name: Combinator chemistry
  origin: "Speroni di Fenizio, 2000"
  book: "9.8; organisations 12"
  refs: ["[790]", "[791]"]
  family: rewriting
  kind: generator
  constructive: true
  S:
    repr: "combinators - strings over a finite alphabet, or combinators themselves (S, K, I basis)"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "application + reduction, as in AlChemy but with combinators replacing lambda-terms; a reaction may yield a whole multiset of products"
  A:
    reactor: well-stirred-multiset
    dilution: "population size may vary (unlike AlChemy/matrix chemistry)"
  params:
    - {name: basis, type: enum, default: "SKI", role: structural}
    - {name: reduction_budget, type: int, role: structural}
    - {name: M, type: int, role: population}
  provides: [topology, catalysts, sequence-structure-function]
  generator_ready: partial
  phenomena: ["emergence of organisations", "avoids lambda-calculus alpha-conversion bookkeeping"]
  notes: >
    Chemart should prefer this over AlChemy as the first constructive
    lambda-family generator: combinators need no variable binding, so the
    normal-form computation is far simpler and faster.
