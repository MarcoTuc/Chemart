chemistries:

- id: combinatory-chemistry
  name: Combinatory Chemistry
  intuition: >
    Combinatory logic turned into a chemistry that conserves its atoms.
    Molecules are expressions built from the three combinators S, K and I.
    Reducing an expression is a reaction, but nothing may be created or
    destroyed: the combinator that fires is released as a free atom, what K
    throws away is released too, and the copy that S needs must be taken from
    the soup as a reactant. Expressions that cannot be reduced are split or
    joined at random. Started from free atoms only, the soup fills with
    expressions, and some of them persist by eating a particular food:
    autopoietic ones that rebuild themselves, recursive ones that keep
    growing, and self-reproducing ones that double. Not to be confused with
    Speroni di Fenizio's combinator chemistry, which reduces to normal form
    and bounds the population from outside.
  aliases: ["CC", "Kruszewski-Mikolov combinatory chemistry"]
  origin: "Kruszewski & Mikolov, 2020"
  book: "-"
  refs: ["doi:10.1162/isal_a_00258", "https://germank.github.io/combinatory-chemistry"]
  family: rewriting
  kind: generator
  constructive: true
  type: gas
  clock: iterations
  S:
    repr: "expressions of combinatory logic over S, K, I, application left-associative, written with as few parentheses as possible (SII(SII)); species id the canonical string, structure the fully bracketed application tree (((SI)I)((SI)I))"
    definition: implicit
    notes: "Size is the number of atoms. The system starts from single atoms only; every other expression is produced by the dynamics."
  R:
    definition: implicit
    arity: [1, 2]
    scheme: "I-reaction e -> e' + I; K-reaction e -> e' + g + K; S-reaction e + x -> e' + S; cleavage xy -> x + y; condensation x + y -> xy; reactant assemblage (F > 1) atoms -> x"
    notes: >
      Reduce reactions on a redex anywhere in the expression alpha X beta
      (paper eqs. 1-3): alpha(I f)beta -> alpha f beta [+I];
      alpha(K f g)beta -> alpha f beta [+g +K];
      alpha(S f g x)beta [+x] -> alpha(f x(g x))beta [+S]. An S-redex is a
      redex of the chemistry only if its third argument x is in the multiset
      (or, with reactant assemblage, can be built from free atoms). Every
      reaction conserves the number of each atom. Reductions take precedence
      over cleavage and condensation (eq. 4), so the paper treats them as
      auto-catalysed.
  A:
    reactor: [well-stirred-multiset]
    dilution: "none needed: the atoms are conserved, so the multiset is bounded by its initial n_I + n_K + n_S atoms"
    notes: >
      Algorithm 1: sample one expression with probability proportional to its
      count; if it has redexes, apply one drawn uniformly from the first
      max_reductions in outer-to-inner order; otherwise cleave it or condense
      it with the last irreducible expression remembered (coin flip). Paper
      runs: 10,000 atoms evenly split, 10 million iterations, F from 1 to 20,
      10 runs per F.
  params:
    - {name: n_I, type: int, default: 334, min: 0, max: 1000000, range: "paper: 10,000 atoms evenly distributed over S, K and I", role: population, meaning: "free I atoms in the initial multiset"}
    - {name: n_K, type: int, default: 333, min: 0, max: 1000000, range: "paper: 10,000 atoms evenly distributed over S, K and I", role: population, meaning: "free K atoms in the initial multiset"}
    - {name: n_S, type: int, default: 333, min: 0, max: 1000000, range: "paper: 10,000 atoms evenly distributed over S, K and I", role: population, meaning: "free S atoms in the initial multiset"}
    - {name: iterations, type: int, default: 20000, min: 0, max: 100000000, range: "paper: 10 million (Figs. 4-5); about 100,000 per second here", role: population, meaning: "iterations of Algorithm 1, one sampled expression each"}
    - {name: F, type: int, default: 1, min: 1, max: 1000, range: "paper: 1 to 20; Fig. 5 uses 1, 3, 6 and 8", role: structural, meaning: "reactant assemblage size: a missing S reactant of at most F atoms is built from free atoms (Algorithm 2); 1 turns assemblage off"}
    - {name: max_reductions, type: int, default: 100, min: 1, max: 100000, range: "paper footnote 3: 100", role: structural, meaning: "a reduction is drawn uniformly among at most this many redexes, the first ones in outer-to-inner order"}
    - {name: record_every, type: int, default: 1000, min: 1, range: "paper Fig. 5 uses windows of 500,000 reactions", role: structural, meaning: "iterations per frame of chemart.evolve (the last iteration always ends a frame); the share of reductions and the reactant consumption are counted over each frame"}
  provides: [topology, stoichiometry, catalysts, initial-state, mass-conservation, sequence-structure-function]
  fidelity: reconstructed
  sources:
    - "Kruszewski, G. & Mikolov, T. (2020). Combinatory Chemistry: Towards a Simple Model of Emergent Evolution. ALIFE 2020: The 2020 Conference on Artificial Life, 411-419. MIT Press. Eqs. 1-4, Algorithms 1-2, Figs. 1-5. doi:10.1162/isal_a_00258"
    - "Reference implementation (Clojure), https://github.com/germank/combinatory-chemistry, read for the order in which redexes are listed (cc.expression/all-reductions) and the size of an expression; the repository has since moved to a Gillespie simulation (the line of the 2022 journal paper, Artificial Life 27(3-4):277-299) and does not contain Algorithm 1."
  decisions:
    - "Not in the book: the paper is from 2020, five years after it. The implementation follows the paper's Algorithm 1 and Algorithm 2."
    - "Outer-to-inner order (footnote 3) is the pre-order of the authors' all-reductions: an expression's own head redex first, then the redexes inside its arguments, left to right. The first max_reductions redexes that are redexes of the chemistry (S-redexes need their reactant) are kept, and one is drawn uniformly."
    - "Cleavage: Algorithm 1 splits e = (xy) into x and y, the top split of the application tree, and Chemart follows it. The paper's text says 'cleaved at a random point', and the authors' later code splits the flat expression at a random position; neither is used."
    - "An atom cannot be cleaved: when cleavage is drawn for S, K or I nothing happens and the iteration is spent (Algorithm 1 is silent)."
    - "Condensation with e_LEFT: Algorithm 1 does not say what happens if e_LEFT has been consumed since it was remembered. Chemart then remembers the new expression instead, as when e_LEFT is undefined; e_LEFT can condense with a copy of itself only if two copies exist."
    - "Reactant assemblage (Algorithm 2) also decides whether an S-redex is available: an S-redex whose reactant is absent counts when the reactant has at most F atoms and the free atoms to build it are in the multiset. The assembly is recorded as its own reaction, atoms -> x, before the S-reaction."
    - "Reactant consumption (Fig. 5) counts the reactants of S-reactions, the only reactions that incorporate a molecule, over each frame; the frame's top_reactants observable keeps the five most consumed."
    - "Mean length (Fig. 4b) is the mean number of atoms per molecule, weighted by counts (the authors' pool-mean-length); diversity (Fig. 4a) is the number of distinct expressions, the number of species in a frame's state."
    - "No rates: the paper samples expressions with probability proportional to their count and defines no rate constants, so rates are None."
    - "chemart.evolve yields a frame every record_every iterations, and at the last one; frame 0 is the initial multiset of free atoms. A frame per iteration would be far too fine (the paper runs 10 million), so record_every stays a parameter. A frame's state is the multiset, its fired the reactions since the previous frame, and its observables mean_length, reductions (the share of iterations since the previous frame that reduced something; 0 in frame 0), free_atoms ({S, K, I}: free atoms of each type) and top_reactants (the five molecules most consumed by S-reactions since the previous frame). generate_network runs the soup to the end and returns the network."
  reference_impl: "https://github.com/germank/combinatory-chemistry (Clojure; a later Gillespie simulation, not Algorithm 1)"
  phenomena:
    - "every reaction conserves the number of S, K and I atoms"
    - "SII(SII) has a metabolic cycle SII(SII) + SII -> I(SII)(I(SII)) + S, then two I-reactions back to SII(SII): (AA) + A => (AA) + phi(A) with A = SII (Fig. 2): simple autopoietic"
    - "I(SII)(I(SII)) has two redexes, the outer and the inner I"
    - "with A = S(SI)I, AA grows by tail recursion: (AA) + 2A => A(AA) + phi(A) (Fig. 3)"
    - "with A = SI(S(SK)I), AA reproduces: (AA) + 3A => 2(AA) + phi(A) (Fig. 1)"
    - "with A = SSK, AAA has the cycle (AAA) + 2A => (AAA) + A + phi(A), one A acting as an emergent catalyst"
    - "from free atoms alone, diversity explodes in the first few hundred thousand reactions, peaks near 300 distinct expressions and then declines, faster for larger F (Fig. 4a)"
    - "reductions are between about 10% and 35% of the reactions (Fig. 4c)"
    - "SII is consumed more than chance would predict because SII(SII) structures emerge (Fig. 5a); F = 3 multiplies them (Fig. 5b); from F = 4 recursively growing structures appear and drive autopoietic ones extinct (Fig. 5c); self-reproducing SI(S(SK)I) structures appear (Figs. 5d-e)"
  notes: >
    Paper-scale runs (10 million iterations of 10,000 atoms) take about three
    minutes at F = 1 in pure Python, longer with reactant assemblage; the
    emergent structures of Fig. 5 need runs of that length.
