chemistries:

- id: tierra
  name: Tierra
  intuition: >
    Self-replicating machine code in a shared memory, and the experiment that
    made digital evolution credible. A creature's genome is a program that
    allocates space and copies itself into it, with mutation from cosmic rays
    and copy errors, while a reaper kills off the oldest and most error-prone.
    Its innovations over Core War are what make individuals meaningful:
    template addressing rather than absolute jumps, plus memory allocation and
    write protection. Parasites that use a neighbour's copy loop, and
    hyper-parasites that exploit them, appear on their own.
  origin: "Ray, 1991"
  book: "10.6.4"
  refs: ["[701]", "[702]", "[818]", "http://tomray.me/pubs/alife2/Ray1991AnApproachToTheSynthesisOfLife.pdf"]
  family: automata
  archived: artificial-life
  kind: generator
  constructive: true
  network: generated
  S:
    repr: >
      Genotypes of self-replicating machine-code creatures: sequences over the
      32 operand-free instructions of instruction set 0 (5 bits each; book
      table 10.3, Ray 1991 appendix B). Species id = size and base-26 label in
      order of appearance within the size class (0080aaa, the ancestor;
      0045aaa, the parasite); structure = the genome as mnemonics.
    definition: implicit
  R:
    definition: implicit
    arity: [1, 2]
    scheme: "G -> G + D (replication; D = the daughter genome, mutated or not) ; G + H -> G + H + D (G replicates by executing code in the genome of a creature of genotype H: parasitism, or mutualism when both partners do it) ; G -> ∅ (death by the reaper) ; G -> G' (a cosmic ray or a write changes a living genome)"
    notes: >
      Reactions are the events observed in one run of the Tierra virtual
      computer: a soup of soup_size instructions, one virtual CPU per
      creature, template addressing by complementary nop_0/nop_1 patterns
      within search_limit, memory allocation with write protection (mal),
      division when at least 70% of the daughter block was copied (divide).
  A:
    reactor: [sequential-vm]
    dilution: "the reaper: a linear queue in birth order, killing the top creature whenever allocated memory exceeds reaper_threshold of the soup (and when mal finds no free block); failed instructions move a creature up, successful mal and divide move it down"
    notes: "time sharing by the slicer: a circular queue, each creature executing size^slice_power instructions per turn (or a constant slice); a newborn enters just ahead of its mother. The dead creature's code stays in the soup."
  params:
    - {name: soup_size, type: int, default: 30000, min: 256, max: 10000000, range: "Ray 1991: 60000 (about 375 ancestors at 80% fill); smaller soups fill faster", role: spatial, meaning: "number of instructions in the circular soup memory"}
    - {name: instructions, type: int, default: 600000, min: 0, max: 10000000000, range: "Ray 1991: about 400000 to fill a 60000 soup; parasites within a few million; runs of 10^8 to 2.86e9", role: population, meaning: "Tierran instructions executed in the run (the clock of Tierra)"}
    - {name: inoculum, type: dict, default: {"0080aaa": 1}, range: "built-in genomes 0080aaa (ancestor), 0045aaa (parasite), 0079aab (immune to 0045aaa), 0046aaa and 0064aaa (hand-dissected mutualists); or a genome written as whitespace-separated mnemonics", role: population, meaning: "initial creatures {genome: count}, placed one after another from address 0 in the order given"}
    - {name: gap, type: int, default: 0, min: 0, max: 10000000, role: spatial, meaning: "free instructions left after each inoculated creature"}
    - {name: search_limit, type: int, default: 400, min: 1, max: 10000000, range: "Ray 1991: generally 200-400, 10000 in the long size-neutral runs; book table 10.3: 1024; Tierra 6.02: 5 x the average creature size", role: spatial, meaning: "maximum distance (instructions) of a template search in each direction; a parasite reproduces only within this distance of a host's copy procedure"}
    - {name: reaper_threshold, type: float, default: 0.8, min: 0.01, max: 1.0, range: "Ray 1991: 80%", role: selection, meaning: "fraction of the soup that may be allocated before the reaper kills"}
    - {name: slicer, type: enum, default: size-dependent, choices: [size-dependent, constant], role: selection, meaning: "size-dependent: a creature executes size^slice_power instructions per time slice; constant: slice_size instructions (selects for small creatures)"}
    - {name: slice_power, type: float, default: 1.0, min: 0.0, max: 4.0, range: "1 = size neutral (the long runs of Ray 1991); > 1 favours large, < 1 small creatures", role: selection, meaning: "slicer power (size-dependent slicer only)"}
    - {name: slice_size, type: int, default: 25, min: 1, max: 1000000, range: "Tierra 6.02 soup_in: 25", role: selection, meaning: "instructions per time slice with the constant slicer"}
    - {name: cosmic_ray_interval, type: int, default: 10000, min: 0, max: 10000000000, range: "Ray 1991: about one bit flipped per 10000 instructions executed; 0 disables", role: stochastic, meaning: "mean number of instructions executed between background mutations (a random bit of a random soup cell is flipped)"}
    - {name: copy_error_interval, type: int, default: 1000, min: 0, max: 10000000000, range: "Ray 1991: one bit per 1000 to 2500 instructions moved; 0 disables", role: stochastic, meaning: "mean number of mov_iab copies between copy mutations (a random bit of the copied instruction is flipped)"}
    - {name: flaw_interval, type: int, default: 26016, min: 0, max: 10000000000, range: "no published value; the default is 32 ancestor replications (813 instructions each), after Tierra 6.02 GenPerFlaw = 32; 0 disables", role: stochastic, meaning: "mean number of instructions executed between flaws (an instruction's result off by +-1)"}
    - {name: semantics, type: enum, default: ray1991, choices: [ray1991, tierra602], role: structural, meaning: "ray1991: after adr/adrb/adrf/call the IP moves to the next instruction, so the template nops execute (the ancestor takes 839 instructions for its first replication and 813 for later ones, Ray 1991); tierra602: the IP skips the template, a jmp without template jumps to bx, a call or adr without template is a no-op (Tierra 6.02; 827 and 809 in its genebank)"}
  provides: [topology, stoichiometry, catalysts, initial-state, sequence-structure-function]
  fidelity: reconstructed
  sources:
    - "Ray, T. S. (1991). An approach to the synthesis of life. In Langton, Taylor, Farmer & Rasmussen (eds.), Artificial Life II, Santa Fe Institute Studies in the Sciences of Complexity XI, 371-408 (book ref [701]). Methods (CPU, template addressing, memory allocation, slicer, reaper, mutation and flaw rates), appendices A (CPU struct), B (instruction set and CPU cycle) and C (the ancestor 0080aaa: 839 and 813 instructions per replication), results (parasite 0045aaa from a mutation of instruction 42, search limit 200-400, immunity of 0079aab, the 0046aaa/0064aaa mutualists, 375 ancestors at 80% fill). http://tomray.me/pubs/alife2/Ray1991AnApproachToTheSynthesisOfLife.pdf and LaTeX source http://tomray.me/pubs/alife2/tierra.tex"
    - "Ray, T. S. Tierra 6.02 source (Tierra6_02.tgz, http://life.ou.edu/tierra/), mirror https://github.com/acisternino/tierra: gb0/opcode.map (instruction set 0), gb0/*.tie (genomes 0080aaa, 0045aaa, 0079aab, 0046aaa, 0064aaa and the 827/809 instruction counts), si0 and soup_in.h (parameters), instruct.c (ctemplate, adrfindtmp, tcall, movii, malchm, divide, push, pop, flaw), decode.c (decadr, decjmp, ptcall, pmovii, dec2s), memalloc.c (mal, write privileges), queues.c (EntBotSlicer, UpRprIf, DownReperIf), slicers.c, tierra.c (TimeSlice, SystemWork, reaper), bookeep.c (CalcFlawRates), operator.c (mutate, mut_site)."
  decisions:
    - "kind changed from framework to generator: the implementation runs the Tierra virtual computer and returns the observed event network."
    - "Base machine: Ray (1991), the book's source; details the paper leaves open are taken from the Tierra 6.02 source (instruction set 0, which has the same 32 opcodes in the same order). The 6.02 extensions not in the 1991 paper are not implemented: multiple CPUs and tracks, genetic operators at division (GenPerDivMut, crossover, insertions, deletions), disturbances, lazy-creature reaping (LazyTol), the reaper's random pick among the top of the queue and the reaping near the requested address (MalReapTol), network migration."
    - "IP after a template instruction: the paper's counts (839 instructions for the first replication of the ancestor, 813 for later ones) are 12 and 4 more than the 6.02 genebank counts (827, 809); 12 = the two 4-nop templates of adrb and adrf plus that of call, 4 = that of call. They are reproduced exactly when, in the 1991 machine, adr/adrb/adrf/call leave the IP on the next instruction (the template nops then execute as no-ops, and call pushes ip + 1), while 6.02 skips the template. Both are offered (semantics); the default is ray1991."
    - "Template search (ctemplate): the template is the run of nops after the instruction; forward candidates start two instructions after the template's end and backward ones at ip - s, advancing together; the first complementary match wins, forward on ties; the address stored or jumped to is just after the matched pattern; the pattern may be part of a longer run of nops. A template not found within search_limit is an error and the instruction is skipped. search_limit is an absolute distance (Ray 1991 quotes 200-400 instructions) rather than the 6.02 multiple of the average creature size; default 400."
    - "No template after jmp/call/adr: an error in ray1991 (the paper: the pattern is not found and the instruction is ignored); in tierra602 jmp and jmpb jump to the address in bx, call pushes ip + 1 and continues, adr does nothing (adrfindtmp with a template of size 0)."
    - "mal (malchm, mal): error if cx < 12, cx >= soup_size, cx equals the current daughter size, or cx > 3 x the creature's size; an existing daughter block of another size is freed first. The block is placed by first fit from address 0 (6.02 MalMode 0; si0 uses a Cartesian-tree 'better fit' that is not ported); if no free block is large enough, creatures are reaped from the top of the queue (skipping the caller) until one is. A successful mal moves the creature down the reaper queue."
    - "divide: error unless the daughter block is at least 12 instructions and at least 70% of it (by count and span) was written by mov_iab since mal (MovPropThrDiv = 0.7). The daughter's CPU starts at its first instruction with zero registers and stack (the gb0 map's C flag). A successful divide moves the mother down the reaper queue; the daughter enters the reaper at the bottom and the slicer just ahead of the mother."
    - "Write protection (MemModeProt = 2): mov_iab may write into the creature's own blocks and into free memory; a write elsewhere, or with source = destination, is an error. Reading and executing are unrestricted."
    - "The reaper runs after every time slice while allocated memory exceeds reaper_threshold x soup_size (Ray 1991 appendix B, life()), and inside mal when the soup has no free block (6.02). It never kills the last creature. Errors are counted per failed instruction and move the creature up while its count is >= that of the creature above (UpRprIf); success moves it down while its count is <= that of the one below (DownReperIf)."
    - "Mutations are bit flips of 5-bit instructions, as in Ray 1991 (a nop mutates into the other nop with probability 1/5); the 6.02 option of replacing 80% of mutated instructions by random ones (MutBitProp) is not used. Intervals between events are drawn uniformly on 1..2 x mean, as the 6.02 counters do (tlrand() % (2 x mean))."
    - "Flaws are applied to the result of the instruction executing when the flaw counter expires (±1 with equal probability): the value of arithmetic, register moves, push and pop, one more or one fewer shift in shl, the neighbouring bit in or1, the tested cx in if_cz, the source address of mov_iab, the size in mal, the position of a found template. 6.02 also flaws register selection in decoding; that is not done. The paper gives no flaw rate: flaw_interval defaults to 32 x 813 instructions, after 6.02's GenPerFlaw = 32 generations, counted per instruction instead of per flaw() call."
    - "A new soup is all nop_0 (calloc in 6.02). Complementary templates of the ancestor all contain nop_1, so an empty soup never matches them. Registers are 32-bit for shl; other arithmetic is exact."
    - "Slicer: size-dependent slices are int(size^slice_power) instructions of the creature's own block (Ray 1991); the 6.02 randomised slice (SliceStyle 2) is not used."
    - "Genotype naming follows the genebank convention (size + base-26 label in order of appearance within the size class), but every new genome is named when it first appears, not only after it has replicated twice. The name of a built-in inoculum genome is kept."
    - "Observed network: a division is a replication G -> G + D, or G + H -> G + H + D when the dividing creature executed any instruction inside the genome of another living creature since its last division (H = the genotype whose code it executed most; parasites execute the host's copy procedure, the mutualists 0046aaa and 0064aaa each other's code). Code of dead creatures left in the soup is not a partner. Deaths are G -> ∅ (embryos dying with their mother are not creatures and leave no event). A cosmic ray or mov_iab that changes a living creature's own genome is recorded as G -> G' and the creature takes the new genotype (6.02 MutBookeep). extras.analysis holds counts of instructions, births, births using another creature's code (parasitic_births), deaths, cosmic rays, copy errors, flaws and errors, the final population, the instructions of the first and second replication of each genotype's first replicator (flaw-free runs only are meaningful), and 50 samples of population, memory fill and size classes."
    - "Not reproduced: the immunity of 0079aab to the parasite 0045aaa. With 0045aaa flanked by two 0079aab in a 60000 soup over 6 million instructions, the parasite gets as many births as between two ancestors (285 vs 263; it declines slowly in both), instead of being quickly eliminated as Ray reports, under both semantics. The paper does not say how those ecological runs were set up beyond zero mutation and creatures breeding true (a 6.02 option, DivSameGen, that is not implemented), so the discrepancy is unresolved. Host-parasite coexistence with the ancestor is likewise not seen: the parasite dies out."
    - "Dropped v1 parameters: mutation_rate is split into cosmic_ray_interval and copy_error_interval (the paper gives both as intervals); ancestor (type matrix) becomes inoculum (a dict of built-in names or mnemonic listings); slice_size keeps its meaning for the constant slicer and slice_power is added for the size-dependent one."
    - "Book refs [702] (network Tierra) and [818] were not used: the single-soup model of [701] is implemented."
  reference_impl: "Tierra 6.02 (C): http://life.ou.edu/tierra/ ; mirror https://github.com/acisternino/tierra"
  phenomena:
    - "the ancestor 0080aaa self-replicates exactly: 839 instructions for the first replication and 813 for each later one (Ray 1991, appendix C)"
    - "the soup fills to the reaper threshold, after which memory stays about 80% full and creatures turn over rapidly (Ray 1991: about 400000 instructions and 375 creatures for a 60000 soup)"
    - "a mutation of the low bit of instruction 42 gives the parasite 0045aaa, which cannot self-replicate alone but replicates with the copy procedure of a host within the search limit (Ray 1991)"
    - "host-parasite Lotka-Volterra cycles; immunity (0079aab) and circumvention; hyper-parasites (0080gai) that capture the parasite's CPU; social hyper-parasites and cheaters (Ray 1991)"
    - "the hand-made 0046aaa and 0064aaa replicate only together (mutualism)"
    - "optimisation of program length under a size-neutral or constant slicer; self-replicators do not arise spontaneously (book 10.6.4)"
  notes: >
    Key innovations vs. Core War: template addressing via NOP0/NOP1
    patterns, memory allocation and protection (which is what makes an
    individual identifiable), and an explicit fitness pressure through the
    reaper. Pure Python executes about a million Tierran instructions
    per second; the defaults run 600000 instructions in a 30000-instruction
    soup (half of Ray's), where the ancestor fills the soup to the reaper
    threshold (at about 200000 instructions) and mutant genotypes appear.
    Ray's 60000 soup fills at about 400000 instructions. Parasites and
    the ecology of Ray's runs need millions to hundreds of millions of
    instructions.
