# Chapter 10: automata and machines. Molecules are programs, tapes, or
# cellular-automaton configurations. The recurring reaction scheme is
# machine + tape -> machine + tape + product.
chemistries:

- id: laing-molecular-machines
  name: Laing's artificial molecular machines
  origin: "Laing, 1972-1977"
  book: "10.5.1"
  refs: ["[484]", "[485]", "[486]", "[487]", "[488]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "symbol strings (usually binary) that exist in two forms: passive data strings and active machine strings (sequences of instructions with a 3D shape, allowing branches and loops)"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: >
      Two molecules attach at one position each. The active one executes
      the instruction at the binding site on the passive one: move left/right,
      read, write. Both binding positions advance.
  A:
    reactor: compartments
    dilution: "not specified - Laing gave no explicit dynamics"
    notes: "artificial organisms are compartments containing molecules of this chemistry"
  params:
    - {name: instruction_set, type: enum, default: "w(1), w(0), TT, CT, L, R, NOP", role: structural}
    - {name: string_length, type: int, role: structural}
  provides: [topology, sequence-structure-function, compartments]
  generator_ready: no
  phenomena: ["universal computation", "self-reproduction by self-inspection and self-description"]
  notes: "Historically first; no dynamics was ever simulated. Implement only if the self-inspection/self-description distinction is wanted as a demo."

- id: typogenetics
  name: Typogenetics
  origin: "Hofstadter, 1979; simulated by Varetto, 1993/1998"
  book: "10.5.2; lock-and-key 11.2"
  refs: ["[391]", "[482]", "[597]", "[598]", "[882]", "[883]", "[785]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "single- and double-stranded sequences over {A, C, G, T} with 3'/5' orientation; and typoenzymes, sequences of amino-acid operations translated from a strand"
    definition: implicit
  R:
    definition: implicit
    arity: "1 (self-reactions only: a strand codes for the enzymes that operate on it)"
    scheme: >
      Translate a strand into typoenzymes (duplets, separated by AA). Each
      enzyme binds a unit on a strand (initial binding base determined
      non-trivially by its tertiary structure = the s/l/r binding
      inclinations of its amino acids) and executes cut, del, swi, mvr,
      mvl, cop on/off, ina/inc/ing/int, rpy/rpu/lpy/lpu.
  A:
    reactor: "sequential: strands interpreted one at a time; all operations coded in a strand are performed before moving on"
    dilution: "a 'lethal factor' variant exists"
  params:
    - {name: code_table, type: enum, default: "Hofstadter", range: "Hofstadter | Varetto", role: structural, meaning: "base-pair -> amino-acid map (book table 10.1); the two variants differ"}
    - {name: strand_length, type: int, role: structural}
    - {name: binding_tiebreak, type: enum, default: random, role: stochastic, meaning: "which unit an enzyme binds when several match"}
    - {name: lethal_factor, type: bool, default: false, role: selection}
  provides: [topology, sequence-structure-function]
  generator_ready: partial
  phenomena: ["self-replicating strands", "autocatalytic 'tanglecycles'"]
  notes: >
    Variable molecule size, variable product count, non-deterministic
    binding: a stress test for Chemart's constructive backend. The two
    published code tables must both be offered - results differ.

- id: mccaskill-polymer-tm
  name: Polymers as Turing machines / pattern processing chemistry
  origin: "McCaskill, 1988; FPGA realisation with Ehricht, Tangen, Breyer"
  book: "10.5.3"
  refs: ["[566]", "[136]", "[247]", "[843]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "binary heteropolymers of length l; each string is both linear molecule and code for a bounded automaton"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "s1 + s2 -> s1 + s3, if pattern p1 ⊆ s1 matches p2 ⊆ s2"
    notes: "patterns are over {0,1,#}; the number of '#' wildcards sets recognition specificity"
  A:
    reactor: lattice-2d
    dilution: "polymers placed at random locations; neighbourhood by distance"
    notes: "probabilistic, constructive Turing machine on a polymer tape; an error rate controls elementary-step precision"
  params:
    - {name: l, type: int, role: structural, meaning: "polymer length"}
    - {name: n_wildcards, type: int, role: structural, meaning: "number of '#' in patterns; controls specificity"}
    - {name: error_rate, type: float, role: stochastic, meaning: "per-step precision of the Turing machine; acts as mutation"}
    - {name: grid, type: matrix, role: spatial}
  provides: [topology, space, sequence-structure-function]
  generator_ready: partial
  phenomena: ["self-replicating strings", "parasites and an evolutionary arms race ending in parasite extinction", "later: hypercycles and chemoton-like cell structures on the lattice version"]

- id: ikegami-hashimoto
  name: Machine-tape chemistry
  origin: "Ikegami & Hashimoto, 1995"
  book: "10.5.4"
  refs: ["[419]", "[420]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: >
      Two separate populations. Tapes: circular binary strings, 7 bits.
      Machines: 4-bit head + 4-bit tail + 8-bit state transition table.
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "sM + sT -> sM + sT + sM' + sT'"
    notes: >
      A machine reacts with a tape if its head matches one substring and
      its tail a different substring; it operates on the reading frame
      between them, giving sT'. sT' is then folded into machine sM' by
      reading 16 bits circularly from the head binding position - so one
      tape can yield different machines depending on the binding site.
  A:
    reactor: ode
    dilution: "population size constant; a fraction c of molecules is replaced by reaction products each update"
    notes: "integer frequency vector <-> real concentration vector conversion with rounding"
  params:
    - {name: tape_len, type: int, default: 7, role: structural}
    - {name: machine_len, type: int, default: 16, range: "4 head + 4 tail + 8 table", role: structural}
    - {name: c, type: float, default: 0.6, role: population, meaning: "fraction of the reactor replaced per generation"}
    - {name: noise, type: float, role: stochastic, meaning: "external noise level; the single most important knob - it selects between Eigen/Schuster hypercycles and double-autocatalytic core networks"}
    - {name: compartments, type: bool, default: false, role: spatial, meaning: "encapsulate reaction systems into diffusing cells (Ikegami & Hashimoto 1997)"}
  provides: [topology, catalysts, flow, sequence-structure-function]
  generator_ready: yes
  phenomena: ["low noise: simple autocatalytic loops, Eigen/Schuster hypercycles, no active mutation", "high noise: double autocatalytic networks with high active mutation", "after ~1000 generations: stable dense 'core networks' that keep their diversity even after noise is switched off"]

- id: automata-reaction
  name: Automata reaction (32-bit binary string chemistry)
  aliases: ["Dittrich-Banzhaf automata chemistry"]
  origin: "Dittrich & Banzhaf, 1998"
  book: "10.6.1"
  refs: ["[233]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "binary strings of exactly 32 bits (one machine word)"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "s1 + s2 -> s1 + s2 + s3"
    notes: >
      s1 is mapped to a finite state automaton by reading successive 4-bit
      groups as machine codes; the automaton runs on s2 in an I/O register
      (read-write) against an operator register holding s1 (read-only).
      Every string can act as automaton and/or operand with equal probability.
  A:
    reactor: [well-stirred-multiset, lattice-2d]
    dilution: "replace a random molecule; M constant"
    notes: "designed to 'respect the medium' - fast enough for M ~ 10^6 over ~10^4 generations"
  params:
    - {name: word_len, type: int, default: 32, role: structural}
    - {name: opcode_width, type: int, default: 4, role: structural}
    - {name: M, type: int, default: 1000000, range: "up to ~1e6", role: population}
    - {name: topology, type: enum, default: well-mixed, range: "well-mixed | 2d-grid", role: spatial}
    - {name: forbid_exact_replication, type: bool, default: false, role: selection, meaning: "make exact self-replication elastic; this is what drives complexity increase"}
  provides: [topology, catalysts, flow, space, sequence-structure-function]
  generator_ready: yes
  phenomena: ["dominance of self-replicators", "catalytic networks", "syntactic/semantic closure of emergent organisations (confirming Fontana)", "'self-evolution': variation and selection with no explicit mutation operator and no fitness function", "spontaneous emergence of recombination", "lazy->eager replicator transitions"]
  notes: >
    The best cost/benefit constructive chemistry in the book: 32-bit words,
    trivially vectorisable, large populations, and it reproduces the
    qualitative results of AlChemy at a fraction of the compute.

- id: corewar
  name: Core War / Redcode
  origin: "Dewdney, 1984"
  book: "10.6.2"
  refs: ["[229]", "[440]", "[432]"]
  family: automata
  kind: framework
  constructive: true
  S:
    repr: "Redcode instructions occupying cells of a cyclic shared memory (core)"
    definition: implicit
  R:
    definition: implicit
    arity: "not well defined - 'reaction' = one program executing over another's code"
    scheme: "no explicit molecule-level reactions; interaction is code overwrite"
  A:
    reactor: sequential-vm
    dilution: "processes die on DAT; process queue length is bounded"
  params:
    - {name: core_size, type: int, role: spatial}
    - {name: instruction_set, type: enum, default: "DAT MOV ADD SUB MUL DIV MOD JMP JMZ JMN DJN SPL CMP SEQ SNE SLT NOP LDP STP", role: structural}
    - {name: max_processes, type: int, role: population}
  provides: [topology, space]
  generator_ready: partial
  notes: >
    Ancestor of Coreworld/Tierra/Avida. Only marginally a chemistry - the
    book itself notes there are no explicitly defined reactions between
    molecules, and even identifying an individual is hard.

- id: coreworld
  name: Coreworld (Venus I / Venus II)
  origin: "Rasmussen et al., 1990/1992"
  book: "10.6.3"
  refs: ["[696]", "[697]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "instructions in a cyclic core memory with periodic boundaries; 'organisms' are collections of instructions working together (hard to individuate)"
    definition: implicit
  R:
    definition: implicit
    arity: variable
    scheme: "execution of code belonging to another molecule counts as a reaction"
  A:
    reactor: sequential-vm
    dilution: "bounded execution-pointer queue"
    notes: "Venus I updates all pointers before writing back (parallel); Venus II executes the top pointer sequentially"
  params:
    - {name: resource_influx, type: float, role: population, meaning: "computational resource refilled per address per step; the key phase parameter ('desert' vs 'jungle')"}
    - {name: max_operation_radius, type: int, role: spatial, meaning: "limit on relative addressing; promotes locality"}
    - {name: pointer_injection_rate, type: float, role: stochastic, meaning: "rate of starting new randomly-initialised execution pointers"}
    - {name: mov_mutation_rate, type: float, role: stochastic, meaning: "probability that copied data is mutated on MOV"}
    - {name: queue_len, type: int, role: population}
    - {name: mode, type: enum, default: venus-ii, range: "venus-i (parallel) | venus-ii (sequential)", role: structural}
  provides: [topology, space, flow]
  generator_ready: partial
  phenomena: ["desert condition (low influx): simple cyclic structures dominate", "jungle condition (high influx): richer diversity and cooperating structures", "spontaneous emergence of self-replicators (Pargellis)"]

- id: tierra
  name: Tierra
  origin: "Ray, 1991"
  book: "10.6.4"
  refs: ["[701]", "[702]", "[818]"]
  family: automata
  kind: framework
  constructive: true
  S:
    repr: "self-replicating assembler programs in a shared core; 32 instructions, 5 bits each, no numeric operands"
    definition: implicit
  R:
    definition: implicit
    arity: 1
    scheme: "s -> s + s' (replication, with mutation); parasitism is one program executing another's code"
  A:
    reactor: sequential-vm
    dilution: "the 'reaper' queue kills programs when allocated memory exceeds a threshold, prioritising those that accumulated error penalties"
  params:
    - {name: soup_size, type: int, role: spatial}
    - {name: mutation_rate, type: float, role: stochastic, meaning: "cosmic-ray + copy-error rates"}
    - {name: reaper_threshold, type: float, role: selection, meaning: "memory fill fraction that triggers culling"}
    - {name: slice_size, type: int, role: population, meaning: "CPU time slice per creature"}
    - {name: ancestor, type: matrix, role: population, meaning: "hand-written seed self-replicator (80 instructions in Ray's original)"}
  provides: [topology, space, flow]
  generator_ready: partial
  phenomena: ["program length optimisation", "parasites, immunity, hyperparasites", "cooperative organisations"]
  notes: >
    Key innovations vs. Core War: template addressing via NOP0/NOP1
    patterns, memory allocation and protection (which is what makes an
    individual identifiable), and an explicit fitness pressure. Note the
    book's caveat: self-replicators do NOT arise spontaneously in Tierra.

- id: avida
  name: Avida
  origin: "Adami & Brown, 1994"
  book: "10.7.1; ecology 8.2.3; evolving distributed algorithms 17.3.2"
  refs: ["[19]", "[16]", "[21]", "[22]", "[567]", "[628]", "[629]", "[467]", "[468]"]
  family: automata
  kind: framework
  constructive: true
  S:
    repr: "an assembler program occupying one cell of a 2D lattice"
    definition: implicit
  R:
    definition: implicit
    arity: 1
    scheme: "s --E--> s + s'  (unimolecular, replicator type; E is CPU time consumed, i.e. 'energy')"
  A:
    reactor: lattice-2d
    dilution: "offspring displaces a neighbour; max population = grid size"
    notes: "parallel execution by time slicing; resources with inflow/outflow reward tasks"
  params:
    - {name: grid, type: matrix, role: spatial, meaning: "2D lattice dimensions = carrying capacity"}
    - {name: instruction_set, type: enum, default: "heads-based (shift-r/l, if-n-equ, if-less, if-label, add, sub, nand, inc, dec, push, pop, swap-stk, swap, IO, jmp-head, get-head, mov-head, set-flow, h-search, h-copy, h-alloc, h-divide, nop-A/B/C)", role: structural}
    - {name: mutation_rates, type: matrix, role: stochastic, meaning: "copy / insert / delete rates"}
    - {name: tasks, type: callable, role: selection, meaning: "external fitness: logic operations on I/O registers, rewarded with CPU time"}
    - {name: resources, type: matrix, role: population, meaning: "resource pools with inflow and outflow rates"}
    - {name: demes, type: int, role: selection, meaning: "subpopulations for group selection; with germline replication this is what let synchronization/desynchronization algorithms evolve"}
    - {name: ancestor, type: matrix, role: population}
  provides: [topology, space, flow, catalysts]
  generator_ready: partial
  reference_impl: "Avida (upstream C++); Nanopond is a <1000-line 2D Tierra/Avida hybrid"
  phenomena: ["evolution of complex features from simple ones", "host-parasite ecologies", "evolved decentralised synchronization and desynchronization", "quantitative match to E. coli population dynamics"]
  notes: >
    Chemart should wrap Avida rather than reimplement it, and expose the
    per-organism reaction s -> 2s plus the resource in/out flows as the
    exported CRN.

- id: sr-loops
  name: Self-replicating loops in cellular automata
  aliases: ["Langton loop", "SDSR loop", "evoloop"]
  origin: "von Neumann 1966; Langton 1984; Byl 1989; Reggia 1993; Sayama 1999-2004"
  book: "10.4, 10.7.2; ecology 8.2.3"
  refs: ["[495]", "[705]", "[744]", "[745]", "[738]", "[739]", "[779]", "[453]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: >
      Two readings. (a) Micro: a cell state IS a molecule (quiescent = absent);
      state transitions are movement and reaction. (b) Macro: an emergent
      loop pattern is a molecule and loop-loop interactions are reactions.
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "loop -> 2 loops (replication); loop -> dissolved (structural dissolution, Sayama's addition)"
  A:
    reactor: lattice-2d
    dilution: "bounded space; loops must keep replicating to hold their concentration"
  params:
    - {name: n_states, type: int, default: 8, range: "29 (von Neumann), 8 (Langton), 6 (Byl), 8 with 5 cells (Reggia)", role: structural}
    - {name: neighbourhood, type: enum, default: von-neumann, range: "von-neumann | moore", role: spatial}
    - {name: grid, type: matrix, role: spatial}
    - {name: dissolution, type: bool, default: true, role: selection, meaning: "Sayama's SDSR: loops dissolve after replication, which is what makes evolution possible"}
    - {name: seed_loop, type: matrix, role: population}
  provides: [topology, space]
  generator_ready: partial
  phenomena: ["self-replication without universal construction", "in bounded space: competition, shrinking loop size, species clustering into islands", "robustness to hardware errors", "changing 'concentrations' of loop species over time"]
  notes: >
    The clearest case in the book where 'what is a molecule' depends on
    the observer. Chemart's export for it must be a *coarse-grained*
    species assignment supplied by the user, not something derivable.

- id: ca-embedded-particles
  name: Embedded particles in cellular automata
  origin: "Hordijk, Crutchfield & Mitchell, 1996-1998"
  book: "10.7.2"
  refs: ["[398]", "[399]"]
  family: automata
  kind: analysis
  constructive: false
  S:
    repr: "moving boundaries between homogeneous CA domains, visible as space-time structures after filtering"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: "particle collisions in the space-time diagram produce, annihilate or transform particles"
  A:
    reactor: lattice-2d
    dilution: none
  params:
    - {name: rule, type: int, role: structural, meaning: "CA rule number"}
    - {name: r, type: int, default: 3, role: spatial, meaning: "CA radius"}
    - {name: lattice_len, type: int, default: 75, role: spatial}
  provides: [topology]
  generator_ready: no
  notes: >
    A *method for reading a CRN out of a CA*, not a chemistry to generate.
    Relevant to Chemart as an import path: given a CA, produce the particle
    catalogue and interaction table.

- id: bondable-ca
  name: Bondable Cellular Automata (BCA)
  origin: "Gross, Banzhaf et al., 2011"
  book: "10.7.3"
  refs: ["[372]", "[373]", "[264]"]
  family: automata
  kind: generator
  constructive: true
  S:
    repr: "an atom is a 1D binary CA with periodic boundaries and width w; a molecule is a set of bonded atoms; atom type = Wolfram rule number 0..255"
    definition: implicit
  R:
    definition: implicit
    arity: 2
    scheme: >
      Association / dissociation driven by an OBSERVABLE of the atoms'
      dynamics (mean polarity after settling). Bonding strength is set by
      the longest contiguous complementary binary run; once bonded, each
      CA's neighbourhood is influenced by the other, which can strengthen
      or weaken the bond.
  A:
    reactor: well-stirred-multiset
    dilution: none
  params:
    - {name: w, type: int, default: 12, role: structural, meaning: "CA width in bits"}
    - {name: rule_set, type: matrix, default: "0..255", role: structural, meaning: "available atom types"}
    - {name: settle_iterations, type: int, default: "2, 8, 32, 128, 512, 2048", role: structural, meaning: "iterations before the mean polarity observable is read"}
    - {name: bond_threshold, type: float, role: structural}
  provides: [topology, energies, sequence-structure-function]
  generator_ready: partial
  phenomena: ["a 'periodic table' of the 256 rules ordered by settled mean polarity (book fig. 10.16)"]
  notes: >
    Called a *subsymbolic* AC: reactivity is not declared but read off an
    emergent property of an internal dynamical system. Mean polarity plays
    the role of an energy-like state variable, so it is one of the few
    entries where `energies` is meaningful without real thermodynamics.
