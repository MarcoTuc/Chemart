chemistries:

- id: rbn
  name: Random Boolean Networks (RBN)
  intuition: >
    Kauffman's random Boolean networks, read as chemistry. Each node's on and
    off states are species and a truth-table row becomes a reaction in which
    the inputs catalyse a switch of the output; attractors of the network are
    then interpreted as cell types, and tuning the number of inputs moves the
    system between frozen, critical and chaotic. (In RBN World, catalog id
    rbn-world, such a network is itself an atom.)
  origin: "Kauffman, 1969"
  book: "18.4.2"
  refs: ["[445]", "[243]", "[348]", "[447]", "[591]", "[291]"]
  family: evolutionary-dynamics
  kind: generator
  constructive: false
  type: generator
  S:
    repr: "two species per node, x{i}_0 and x{i}_1 (node i off / on)"
    definition: implicit
  R:
    definition: implicit
    arity: "k_i + 1 for node i with k_i inputs (k_i when node i reads itself)"
    scheme: >
      s_i(t+1) = f_i(inputs of i). Truth-table row r of node i is the
      reaction  x{j1}_{b1} + ... + x{jk}_{bk} + x{i}_{1-f_i(r)} -> x{j1}_{b1} + ... + x{i}_{f_i(r)}
      (the inputs catalyse the switch)
  A:
    reactor: maximally-parallel
    dilution: none
    notes: "synchronous update of every node (book); the analysis in extras is of that map"
  params:
    - {name: N, type: int, default: 10, min: 1, max: 16, role: structural, meaning: "number of nodes; attractors are enumerated over all 2^N states, hence the cap"}
    - {name: K, type: int, default: 2, min: 1, max: 12, range: "1 <= K <= N; K = 1 frozen, K = 2 critical ('edge of chaos') at function_bias 0.5, K = N chaotic", role: structural, meaning: "inputs per node, or the mean in-degree when K_distribution is not constant"}
    - {name: K_distribution, type: enum, default: constant, choices: [constant, poisson, power-law], role: structural, meaning: "in-degrees fixed at K, 1 + Poisson(K - 1) capped at N, or a power law P(k) ~ k^-gamma on 1..N with mean K (scale-free GRNs, Fox & Hill)"}
    - {name: function_bias, type: float, default: 0.5, min: 0, max: 1, role: structural, meaning: "probability that a truth-table output is 1; the annealed sensitivity is 2 K p (1 - p)"}
  provides: [topology, stoichiometry, catalysts, initial-state]
  fidelity: reconstructed
  sources:
    - "Banzhaf & Yamamoto (2015), section 18.4.2: the classic RBN (N nodes, K inputs with 1 <= K <= N, random functions, synchronous update, distributions of K with mean K)"
    - "Faulconbridge, A. (2011). RBN-World: sub-symbolic artificial chemistry for artificial life. PhD thesis, University of York. Used here only for RBN conventions: truth-table row order (table 5.2.1) and its choice of inputs (see decisions); the chemistry of the thesis is catalog id rbn-world. https://etheses.whiterose.ac.uk/2061/"
    - "Faulkner, P., Krastev, M., Sebald, A. & Stepney, S. (2018). Sub-symbolic artificial chemistries. In Inspired by Nature, Springer. Used here only for the choice of inputs (no duplicates, possibly the node itself). https://www-users.york.ac.uk/~ss44/bib/ss/nonstd/ssachem2018.pdf"
    - "Drossel, B. (2008). Random Boolean networks (book ref [243]), eq. 10: sensitivity lambda = 2 K p (1 - p); K = N networks are chaotic. https://arxiv.org/abs/0706.3351"
    - "Aldana, M. (2003). Boolean dynamics of networks with scale-free topology. Physica D 185:45-66: power-law in-degrees P(k) = k^-gamma / zeta(gamma). https://arxiv.org/abs/cond-mat/0209571"
  decisions:
    - "RBN World, which the book describes in the same section, was the model=rbn-world variant of this entry until the chemistries got two faces (generate and evolve). It is now its own entry, rbn-world, a gas with an evolve face; its atoms are built with this module's random_rbn. This entry is the book's classic RBN only, a generator, and the model parameter is gone."
    - "RBN network form: node i has species x{i}_0 and x{i}_1 (presence/absence, as in organization-computing), and each truth-table row whose output differs from node i's state in that row is one reaction in which the row's input species catalyse the switch. Rows where node i already shows the output would be null reactions and are omitted. No rates: the model is Boolean."
    - "A synchronous update of all nodes is not a reaction network. With one molecule per node the reactions give node-by-node (asynchronous) dynamics, so the book's synchronous map is analysed in extras.analysis: attractors (length, basin size, cycle states, listing capped at 64 states), the random initial state's attractor and transient, inputs, functions, in-degrees, average and annealed sensitivity. N is capped at 16 because attractors are enumerated over all 2^N states."
    - "Inputs are K distinct nodes and may include the node itself: the book allows 1 <= K <= N, and Faulkner et al. (2018) use 'no duplicates, possibly itself'. Kauffman (1969) excluded self-inputs and the thesis allowed duplicates. Truth-table row r reads the inputs as bits with the first input highest (thesis table 5.2.1)."
    - "function_bias is not in the book's text. It is the biased-function ensemble of Drossel [243], where the order/chaos boundary is 2 K p (1 - p) = 1. The book's 'uniformly random function' is function_bias = 0.5."
    - "K distributions: the book asks for distributions with mean K, and Fox & Hill [291] compare delta, Poisson and power-law in-degrees (only their abstract was accessible). poisson: k = 1 + Poisson(K - 1), capped at N, which keeps k >= 1 as the book requires. power-law: P(k) ~ k^-gamma truncated to 1..N (Aldana's form), with gamma solved so the mean is K. That needs K < (N + 1) / 2, otherwise ValueError; K = 1 gives all k = 1. Only in-degrees vary; inputs are still drawn uniformly."
    - "v1 parameters dropped: update (the book specifies synchronous update, and the reaction network is the same for any update scheme) and bonding_sites (b = 2 in every RBN World source)."
  phenomena:
    - "cycle attractors interpreted as cell types (Kauffman's cell-differentiation conjecture)"
    - "order/chaos transition with K: K = 1 frozen, K = 2 critical, K = N chaotic with attractor lengths of order 2^(N/2) (Drossel)"
    - "annealed sensitivity lambda = 2 K p (1 - p), critical at lambda = 1"
    - "scale-free in-degree distributions give more ordered dynamics (Fox & Hill)"
